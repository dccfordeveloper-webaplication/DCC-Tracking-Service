        // ==========================================

        async function loadSupabaseData() {
            if (!supabaseClient) return;
            try {
                const { data: ordersData, error: ordErr } = await supabaseClient.from('orders').select('*');
                const { data: servicesData, error: svcErr } = await supabaseClient.from('services').select('*');

                if (!ordErr && ordersData) {
                    appData.orders = ordersData.map(o => ({
                        id: o.id, 
                        date: o.date, 
                        customerName: o.customer_name, 
                        room: o.room, 
                        phone: o.phone || '',
                        orderType: o.order_type, 
                        estimatedPrice: o.estimated_price, 
                        progress: o.progress ?? 0, 
                        excelData: o.excel_data || []
                    }));
                }
                if (!svcErr && servicesData) {
                    appData.services = servicesData.map(s => ({
                        id: s.id, 
                        date: s.date, 
                        customerName: s.customer_name, 
                        room: s.room, 
                        phone: s.phone || '',
                        kelengkapan: s.kelengkapan || '', 
                        notes: s.notes || '', 
                        estimatedPrice: s.estimated_price, 
                        progress: s.progress ?? 0, 
                        items: s.items || []
                    }));
                }
                renderApp();
            } catch (err) {
                console.error("Gagal sinkronisasi data Supabase:", err);
            }
        }

        function initRealtimeSubscription() {
            if (!supabaseClient) return;
            try {
                supabaseClient.channel('public-db-changes')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => loadSupabaseData())
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'services' }, () => loadSupabaseData())
                    .subscribe();
            } catch (e) {
                console.error("Realtime subscription error:", e);
            }
        }

        function formatRupiah(amount) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(amount || 0);
        }

        function generateUniqueId(prefix) {
            return `${prefix}-${Math.floor(1000 + Math.random() * 9000)}`;
        }

        function getTodayDateString() {
            return new Date().toISOString().split('T')[0];

        function terbilang(nilai) {
            const angka = ["", "Satu", "Dua", "Tiga", "Empat", "Lima", "Enam", "Tujuh", "Delapan", "Sembilan", "Sepuluh", "Sebelas"];
            let n = Math.floor(Math.abs(nilai));
            if (n === 0) return "Nol Rupiah";

            function convert(num) {
                if (num < 12) {
                    return " " + angka[num];
                } else if (num < 20) {
                    return convert(num - 10) + " Belas";
                } else if (num < 100) {
                    return convert(Math.floor(num / 10)) + " Puluh" + convert(num % 10);
                } else if (num < 200) {
                    return " Seratus" + convert(num - 100);
                } else if (num < 1000) {
                    return convert(Math.floor(num / 100)) + " Ratus" + convert(num % 100);
                } else if (num < 2000) {
                    return " Seribu" + convert(num - 1000);
                } else if (num < 1000000) {
                    return convert(Math.floor(num / 1000)) + " Ribu" + convert(num % 1000);
                } else if (num < 1000000000) {
                    return convert(Math.floor(num / 1000000)) + " Juta" + convert(num % 1000000);
                } else if (num < 1000000000000) {
                    return convert(Math.floor(num / 1000000000)) + " Milyar" + convert(num % 1000000000);
                }
                return "";
            }

            return convert(n).trim() + " Rupiah";
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-blue-600';
            const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
            
            toast.className = `${bgClass} text-white px-4 py-3 rounded-2xl shadow-xl flex items-center gap-3 transition-all duration-300 transform translate-x-10 opacity-0 pointer-events-auto text-xs font-semibold`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-base"></i> <span>${message}</span>`;
            
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-x-10', 'opacity-0'));

            setTimeout(() => {
                toast.classList.add('translate-x-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function openModal(contentHtml) {
            const overlay = document.getElementById('modalOverlay');
            const container = document.getElementById('modalContainer');
            if (!overlay || !container) return;
            container.innerHTML = contentHtml;
            overlay.classList.remove('hidden');
            requestAnimationFrame(() => {
                overlay.classList.remove('opacity-0');
                container.classList.remove('scale-95', 'opacity-0');
                container.classList.add('scale-100', 'opacity-100');
            });
        }

        function closeModal() {
            const overlay = document.getElementById('modalOverlay');
            const container = document.getElementById('modalContainer');
            if (!overlay || !container) return;
            container.classList.remove('scale-100', 'opacity-100');
            container.classList.add('scale-95', 'opacity-0');
            overlay.classList.add('opacity-0');
            setTimeout(() => overlay.classList.add('hidden'), 300);
        }

        // ==========================================
        // GENERATE INVOICE & KWITANSI PDF
        // (A4 otomatis menyesuaikan: 1 halaman rapi, atau multi-halaman bila item banyak)
        // ==========================================
        const DOC_PAGE_WIDTH_PX = 794; // lebar A4 (210mm) pada 96dpi
        const DOC_FONT = "'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif";

        function escapeHtml(value) {
            return String(value === undefined || value === null ? '' : value).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function formatTanggal(str) {
            if (!str) return '';
            const d = new Date(`${str}T00:00:00`);
            if (isNaN(d.getTime())) return escapeHtml(str);
            return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        // Normalisasi data baris tabel dari pesanan / service
        function getDocumentRows(dataItem, isOrder, subtotal) {
            if (isOrder) {
                if (dataItem.excelData && dataItem.excelData.length > 0) {
                    return dataItem.excelData.map(it => ({
                        name: it.component,
                        desc: it.spec,
                        qty: it.qty,
                        price: it.price,
                        total: (Number(it.qty) || 0) * (Number(it.price) || 0)
                    }));
                }
                return [{
                    name: dataItem.orderType || 'Pemesanan',
                    desc: `Paket Pemesanan ${dataItem.orderType || ''}`.trim(),
                    qty: 1, price: subtotal, total: subtotal
                }];
            }
            if (dataItem.items && dataItem.items.length > 0) {
                const n = dataItem.items.length;
                const base = Math.floor(subtotal / n);
                return dataItem.items.map((it, i) => {
                    const price = i === n - 1 ? subtotal - base * (n - 1) : base;
                    return { name: it.name, desc: it.issue ? `Kendala: ${it.issue}` : 'Perbaikan unit', qty: 1, price, total: price };
                });
            }
            return [{ name: 'Jasa Service', desc: 'Perbaikan Unit Hardware / Software', qty: 1, price: subtotal, total: subtotal }];
        }

        function docWrapper(innerHtml, pinFooter) {

            return `<div id="printablePaper" style="font-family:${DOC_FONT}; font-size:12px; line-height:1.4; color:#1e293b; background:#ffffff; box-sizing:border-box; display:flex; flex-direction:column; justify-content:${pinFooter ? 'space-between' : 'flex-start'}; ${pinFooter ? 'min-height:268mm;' : ''}">${innerHtml}</div>`;

                    <div id="docViewport" class="bg-slate-100 rounded-2xl p-3 sm:p-5 overflow-hidden">

                            <div id="docPaper" style="width:${DOC_PAGE_WIDTH_PX}px; min-height:1123px; box-sizing:border-box; padding:12mm 15mm 14mm; background:#ffffff; box-shadow:0 10px 30px rgba(15,23,42,0.15); border:1px solid #e2e8f0; transform-origin:top left;">

        // Skala pratinjau otomatis menyesuaikan lebar layar
        function fitDocPreview() {
            const viewport = document.getElementById('docViewport');
            const sizer = document.getElementById('docSizer');
            const paper = document.getElementById('docPaper');
            if (!viewport || !sizer || !paper) return;
            const cs = getComputedStyle(viewport);
            const avail = viewport.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
            if (avail <= 0) return;
            const scale = Math.min(1, avail / DOC_PAGE_WIDTH_PX);
            paper.style.transform = `scale(${scale})`;
            sizer.style.width = `${DOC_PAGE_WIDTH_PX * scale}px`;
            sizer.style.height = `${paper.offsetHeight * scale}px`;
        }
        window.addEventListener('resize', fitDocPreview);

        // Tunggu font & gambar siap supaya hasil PDF tidak bergeser
        async function waitForDocAssets(element) {
            try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}
            const imgs = Array.from(element.querySelectorAll('img'));
            await Promise.all(imgs.map(img => img.complete ? Promise.resolve() : new Promise(res => { img.onload = img.onerror = res; })));
        }

        async function downloadDocumentPdf(filename) {
            const element = document.getElementById('printablePaper');
            if (!element) return;
            showToast('Menyiapkan berkas PDF A4...', 'info');

            try {
                await waitForDocAssets(element);

                const opt = {
                    // Margin dipasang di PDF (bukan padding) agar setiap halaman tetap rapi
                    margin:      [12, 15, 14, 15],
                    filename:    `${filename}.pdf`,
                    image:       { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', scrollX: 0, scrollY: 0 },
                    jsPDF:       { unit: 'mm', format: 'a4', orientation: 'portrait', compress: true },
                    pagebreak:   { mode: ['css', 'legacy'], avoid: ['tr', '.avoid-break'] }
                };

                await html2pdf().set(opt).from(element).save();
                showToast('PDF berhasil diunduh!', 'success');
            } catch (err) {
                console.error(err);
                showToast('Gagal membuat PDF. Coba lagi.', 'error');
            }
        }

        // Cetak langsung memakai salinan dokumen (tidak terpengaruh skala pratinjau)
        function printDocument() {
            const element = document.getElementById('printablePaper');
            if (!element) return;
            const old = document.getElementById('printHost');
            if (old) old.remove();

            const host = document.createElement('div');
            host.id = 'printHost';
            const copy = element.cloneNode(true);
            copy.removeAttribute('id');
            host.appendChild(copy);
            document.body.appendChild(host);
            document.body.classList.add('printing');

            const cleanup = () => {
                document.body.classList.remove('printing');
                host.remove();
                window.removeEventListener('afterprint', cleanup);
            };
            window.addEventListener('afterprint', cleanup);
            setTimeout(() => window.print(), 80);
        }

        function handleExcelPaste(e) {
            e.preventDefault();
            const clipboardData = (e.clipboardData || window.clipboardData).getData('text');
            if (!clipboardData) return;
            const rows = clipboardData.trim().split(/\r\n|\n|\r/);
            const parsedItems = [];
            let calculatedTotal = 0;

            rows.forEach(rowStr => {
                const cols = rowStr.split('\t');
                if (cols.length >= 2) {
                    const component = cols[0] ? cols[0].trim() : 'Komponen';
                    const spec = cols[1] ? cols[1].trim() : '-';
                    const qty = cols[2] && !isNaN(parseInt(cols[2])) ? parseInt(cols[2]) : 1;
                    let price = cols[3] ? parseInt(cols[3].replace(/[^0-9]/g, '')) || 0 : 0;
                    parsedItems.push({ component, spec, qty, price });
                    calculatedTotal += (qty * price);
                }
            });

            window.tempExcelParsed = parsedItems;
            renderExcelPreviewTable(parsedItems);
            if (calculatedTotal > 0) document.getElementById('ordPrice').value = calculatedTotal;
            showToast(`Berhasil mengonversi ${parsedItems.length} baris Excel!`, 'success');
        }

        function renderExcelPreviewTable(items) {
            const tbody = document.getElementById('excelPreviewBody');
            if (!tbody) return;
            if (items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-3 text-center text-slate-400 text-xs">Belum ada data tabel. Paste dari Excel di atas.</td></tr>`;
                return;
            }
            tbody.innerHTML = items.map(it => `
                <tr class="hover:bg-slate-50">
                    <td class="p-2 font-semibold text-slate-800">${it.component}</td>
                    <td class="p-2 text-slate-600">${it.spec}</td>
                    <td class="p-2 text-center">${it.qty}</td>
                    <td class="p-2 text-right">${formatRupiah(it.price)}</td>
                </tr>
            `).join('');
        }

        async function saveOrderForm(e, editId) {
            e.preventDefault();
            const idVal = document.getElementById('ordId').value;

            const customerNameVal = document.getElementById('ordCustomer').value;
            const roomVal = document.getElementById('ordRoom').value;

            const orderTypeVal = document.getElementById('ordType').value;
            const priceVal = parseInt(document.getElementById('ordPrice').value) || 0;

            const dbPayload = {
                id: idVal,
                date: dateVal,
                customer_name: customerNameVal,
                room: roomVal,
                phone: phoneVal,
                order_type: orderTypeVal,
                estimated_price: priceVal,
                excel_data: excelDataVal
            };

            if (supabaseClient) {
                let res;
                if (editId) {
                    res = await supabaseClient.from('orders').update(dbPayload).eq('id', editId);
                } else {
                    dbPayload.progress = 0;
                    res = await supabaseClient.from('orders').insert([dbPayload]);
                }

                if (res.error) {
                    console.error("Error Simpan Order Supabase:", res.error);
                    showToast('Gagal menyimpan: ' + res.error.message, 'error');
                    return;

                await loadSupabaseData();

                    const idx = appData.orders.findIndex(o => o.id === editId);
                    if (idx !== -1) {
                        appData.orders[idx] = { ...appData.orders[idx], date: dateVal, customerName: customerNameVal, room: roomVal, phone: phoneVal, orderType: orderTypeVal, estimatedPrice: priceVal, excelData: excelDataVal };
                    }

                    appData.orders.unshift({ id: idVal, date: dateVal, customerName: customerNameVal, room: roomVal, phone: phoneVal, orderType: orderTypeVal, estimatedPrice: priceVal, progress: 0, excelData: excelDataVal });

        async function saveServiceForm(e, editId) {
            e.preventDefault();
            const itemRows = document.querySelectorAll('.service-item-row');
            const items = [];
            itemRows.forEach(row => {
                const name = row.querySelector('.svc-item-name').value;
                const issue = row.querySelector('.svc-item-issue').value;
                if (name && issue) items.push({ name, issue });
            });

            if (items.length === 0) {
                showToast('Harap isi minimal 1 barang service!', 'error');
                return;
            }

            const idVal = document.getElementById('svcId').value;
            const dateVal = document.getElementById('svcDate').value || getTodayDateString();
            const customerNameVal = document.getElementById('svcCustomer').value;
            const roomVal = document.getElementById('svcRoom').value;
            const phoneVal = document.getElementById('svcPhone').value;
            const kelengkapanVal = document.getElementById('svcKelengkapan').value;
            const notesVal = document.getElementById('svcNotes').value;
            const priceVal = parseInt(document.getElementById('svcPrice').value) || 0;

            const dbPayload = {
                id: idVal,
                date: dateVal,
                customer_name: customerNameVal,
                room: roomVal,
                phone: phoneVal,
                kelengkapan: kelengkapanVal,
                notes: notesVal,
                estimated_price: priceVal,
                items: items
            };

            if (supabaseClient) {
                let res;
                if (editId) {
                    res = await supabaseClient.from('services').update(dbPayload).eq('id', editId);
                } else {
                    dbPayload.progress = 0;
                    res = await supabaseClient.from('services').insert([dbPayload]);
                }

                if (res.error) {
                    console.error("Error Simpan Service Supabase:", res.error);
                    showToast('Gagal menyimpan: ' + res.error.message, 'error');
                    return;
                }
                await loadSupabaseData();
            } else {
                if (editId) {
                    const idx = appData.services.findIndex(s => s.id === editId);
                    if (idx !== -1) {
                        appData.services[idx] = { ...appData.services[idx], date: dateVal, customerName: customerNameVal, room: roomVal, phone: phoneVal, kelengkapan: kelengkapanVal, notes: notesVal, estimatedPrice: priceVal, items: items };
                    }
                } else {
                    appData.services.unshift({ id: idVal, date: dateVal, customerName: customerNameVal, room: roomVal, phone: phoneVal, kelengkapan: kelengkapanVal, notes: notesVal, estimatedPrice: priceVal, progress: 0, items: items });
                }
                renderApp();
            }
            closeModal();
            showToast('Data service berhasil disimpan!', 'success');
        }

        async function updateServiceStatus(id, newStatusIdx) {
            if (supabaseClient) {
                await supabaseClient.from('services').update({ progress: parseInt(newStatusIdx) }).eq('id', id);
                await loadSupabaseData();
            } else {
                const idx = appData.services.findIndex(s => s.id === id);
                if (idx !== -1) appData.services[idx].progress = parseInt(newStatusIdx);
            }
            showToast(`Status ${id} diperbarui!`, 'success');
        }

        async function deleteService(id) {
            if (confirm(`Yakin ingin menghapus service ${id}?`)) {
                if (supabaseClient) {
                    await supabaseClient.from('services').delete().eq('id', id);
                    await loadSupabaseData();
                } else {
                    appData.services = appData.services.filter(s => s.id !== id);
                    renderApp();
                }
                showToast('Data service berhasil dihapus.', 'info');
            }
        }

        function applyRiwayatFilter() {
            const keyword = document.getElementById('filterRiwayatSearch')?.value.toLowerCase() || '';

            const filterFn = (item) => {
                const matchKw = item.id.toLowerCase().includes(keyword) || item.customerName.toLowerCase().includes(keyword) || item.room.toLowerCase().includes(keyword);
                let matchDate = true;
                if (dateFrom && item.date < dateFrom) matchDate = false;
                if (dateTo && item.date > dateTo) matchDate = false;
                return matchKw && matchDate;
            };

            const filteredServices = appData.services.filter(filterFn);
            const filteredOrders = appData.orders.filter(filterFn);

            const countSvcEl = document.getElementById('countSvcRiwayat');
            if (countSvcEl) countSvcEl.textContent = filteredServices.length;

            const countOrdEl = document.getElementById('countOrdRiwayat');
            if (countOrdEl) countOrdEl.textContent = filteredOrders.length;

            });
            const svcDates = Object.keys(serviceMap).sort();

            appData.orders.forEach(item => {
                const date = item.date || 'Lainnya';
                orderMap[date] = (orderMap[date] || 0) + (item.estimatedPrice || 0);
            });
            const ordDates = Object.keys(orderMap).sort();
            const ordTotals = ordDates.map(date => orderMap[date]);

function posWalk(){const items={};POS.items.filter(i=>i.account===POS.s.account).forEach(i=>items[i.id]={qty:0,avg:0});
 POS.moves.filter(m=>m.account===POS.s.account).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id-b.id).forEach(m=>{
  const it=items[m.itemId]||(items[m.itemId]={qty:0,avg:0});
  if(m.type==='in'){const nq=it.qty+m.qty;it.avg=nq>0?(it.qty*it.avg+m.qty*m.unitCost)/nq:m.unitCost;it.qty=nq;}
  else if(m.type==='out')it.qty-=m.qty;else it.qty+=m.qty;});
 return items;}
function posList(){const w=posWalk();return POS.items.filter(i=>i.account===POS.s.account).map(i=>({...i,qty:(w[i.id]||{}).qty||0,avg:(w[i.id]||{}).avg||0}));}
function posSave(){localStorage.setItem('dcc_pos_settings',JSON.stringify(POS.s));}
async function posLoad(){
 if(!finClient){POS.err='Library Supabase tidak termuat.';POS.loaded=true;return posRefreshAll();}
 const r=await Promise.all([finClient.from('accounts').select('name,options').order('id'),finClient.from('inventory_items').select('*').order('id'),finClient.from('inventory_moves').select('*').order('id')]);
 const bad=r.find(x=>x.error);
 if(bad){POS.err=bad.error.message;POS.loaded=true;return posRefreshAll();}
 POS.err='';POS.accounts=r[0].data.map(a=>a.name);POS.opt={};
 r[0].data.forEach(a=>{let o=a.options;if(typeof o==='string'){try{o=JSON.parse(o)}catch(e){o=null}}POS.opt[a.name]=o&&o.in&&o.out?o:{in:{cashTypes:[]},out:{cashTypes:[]}};});
 POS.items=r[1].data.map(i=>({id:i.id,account:i.account,name:i.name,unit:i.unit||'pcs',sellPrice:Number(i.sell_price||0),barcode:i.barcode||''}));
 POS.moves=r[2].data.map(m=>({id:m.id,account:m.account,itemId:m.item_id,date:m.date,type:m.type,qty:Number(m.qty),unitCost:Number(m.unit_cost||0)}));
 if(!POS.accounts.includes(POS.s.account))POS.s.account=POS.accounts[0]||'';
 POS.cart=POS.cart.filter(c=>c.type!=='stock'||POS.items.some(i=>i.id===c.id));
 try{const pr=await finClient.from('pos_sales').select('items').order('id',{ascending:false}).limit(2000);
  if(!pr.error&&pr.data){const ps=new Set();pr.data.forEach(r=>(r.items||[]).forEach(i=>{if(i&&i.ref)ps.add(i.ref);}));POS.paid=ps;POS.cart=POS.cart.filter(c=>!c.ref||!ps.has(c.ref));}}catch(e){}
 POS.loaded=true;if(!POS.rt)posRealtime();posRefreshAll();}
function posRealtime(){POS.rt=true;let t;
 try{finClient.channel('pos-sync').on('postgres_changes',{event:'*',schema:'public'},()=>{clearTimeout(t);t=setTimeout(posLoad,600);}).subscribe();}catch(e){}
 setInterval(()=>{if(!document.hidden&&(appData.activeTab==='kasir'||appData.activeTab==='stok'))posLoad();},20000);}
function posRefreshAll(){const t=appData.activeTab;
 if(t==='kasir'&&$p('posGrid')&&!POS.err){posRenderGrid();posRenderCart();}else if(t==='kasir'||t==='stok')renderApp();}

function renderTabKasir(){
 if(POS.err)return posErrBox();const s=POS.s;
 return `<div class="space-y-4"><div class="flex flex-wrap items-center justify-between gap-2"><div><h2 class="text-xl font-extrabold text-slate-800">Kasir</h2>
  <p class="text-xs text-slate-500">Akun: <b>${pe(s.account||'-')}</b> &bull; Kas tunai: <b>${pe(s.cashKas||'-')}</b> &bull; Non-tunai: <b>${pe(s.cashlessKas||s.cashKas||'-')}</b></p></div>
  <div class="flex gap-2"><button onclick="posPrinterModal()" id="posPrinterBtn" class="${BTN}bg-slate-100 text-slate-700 hover:bg-slate-200"><i class="fa-solid fa-print"></i> ${POS.printer?pe(POS.printer.name):'Printer'}</button>
  <button onclick="posSettings()" class="${BTN}bg-slate-100 text-slate-700 hover:bg-slate-200"><i class="fa-solid fa-gear"></i> Pengaturan</button></div></div>
  ${s.account&&s.cashKas?'':'<div class="p-3 rounded-xl bg-amber-50 border border-amber-200 text-amber-800 text-xs">Atur <b>akun</b> dan <b>kas</b> terlebih dahulu di Pengaturan agar pemasukan masuk ke Bendahara.</div>'}
  <div class="grid lg:grid-cols-5 gap-4"><div class="lg:col-span-3 space-y-3">
   <div class="relative"><i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400 text-sm"></i><input id="posSearch" value="${pe(POS.q)}" oninput="posOnSearch(this.value)" onkeydown="if(event.key==='Enter')posEnter()" placeholder="Cari nama / scan barcode / nomor pesanan (F3)" class="${INP} pl-10 !py-3 font-semibold" autocomplete="off"></div>
   <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm"><div class="grid grid-cols-12 gap-1 px-3 py-2 bg-[#003b87] text-white text-[11px] font-bold"><div class="col-span-5">Produk</div><div class="col-span-3 text-center">Qty</div><div class="col-span-2 text-right">Harga</div><div class="col-span-2 text-right">Jumlah</div></div>
   <div id="posCart" class="max-h-[44vh] min-h-[160px] overflow-y-auto"></div></div><div id="posTotals"></div></div>
  <div class="lg:col-span-2 space-y-3"><div id="posTabs" class="grid grid-cols-3 gap-1 p-1 bg-slate-100 rounded-2xl">${posTabsHtml()}</div>
   <div id="posGrid" class="grid grid-cols-2 gap-2 max-h-[44vh] overflow-y-auto pr-1"></div>
   <div class="grid grid-cols-4 gap-1.5"><button onclick="posDiscount()" class="${BTN}!px-1 bg-slate-100 hover:bg-slate-200 text-slate-700"><i class="fa-solid fa-percent"></i> Diskon<div class="text-[9px] opacity-60">F2</div></button>
   <button onclick="posManual()" class="${BTN}!px-1 bg-slate-100 hover:bg-slate-200 text-slate-700"><i class="fa-solid fa-pen"></i> Item Lain<div class="text-[9px] opacity-60">manual</div></button>
   <button onclick="posNew()" class="${BTN}!px-1 bg-slate-100 hover:bg-slate-200 text-slate-700"><i class="fa-solid fa-plus"></i> Baru<div class="text-[9px] opacity-60">F8</div></button>
   <button onclick="posLast()" class="${BTN}!px-1 bg-slate-100 hover:bg-slate-200 text-slate-700"><i class="fa-solid fa-receipt"></i> Struk<div class="text-[9px] opacity-60">terakhir</div></button></div>
   <button onclick="posVoid()" class="w-full ${BTN}bg-rose-600 hover:bg-rose-700 text-white"><i class="fa-solid fa-trash"></i> Batalkan Transaksi</button>
   <button onclick="posPay()" class="w-full py-4 rounded-2xl bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold text-lg shadow-lg transition active:scale-95">Bayar <span class="text-xs opacity-80">(F10)</span></button></div></div></div>`;}
function posSub(){return POS.cart.reduce((t,c)=>t+c.qty*c.price,0);}
function posTabsHtml(){
 const unpaid=a=>(a||[]).filter(r=>!POS.paid.has(r.id)).length;
 const t=(k,l,ic,n)=>`<button onclick="posView('${k}')" class="${BTN}${POS.view===k?'bg-[#003b87] text-white shadow':'text-slate-600 hover:bg-white'}"><i class="fa-solid ${ic}"></i> ${l}${n?` <span class="ml-0.5 px-1.5 rounded-full text-[10px] ${POS.view===k?'bg-white/25':'bg-slate-200'}">${n}</span>`:''}</button>`;
 return t('stock','Barang','fa-boxes-stacked',0)+t('order','Pesanan PC','fa-desktop',unpaid(appData.orders))+t('service','Service','fa-wrench',unpaid(appData.services));}
function posView(v){POS.view=v;POS.q='';const e=$p('posSearch');if(e)e.value='';const t=$p('posTabs');if(t)t.innerHTML=posTabsHtml();posRenderGrid();}
function posOnSearch(v){POS.q=v;posRenderGrid();}
function posRenderGrid(){const g=$p('posGrid');if(!g)return;const q=POS.q.trim().toLowerCase();
 const tb=$p('posTabs');if(tb)tb.innerHTML=posTabsHtml();
 if(POS.view==='stock'){
  g.className='grid grid-cols-2 gap-2 max-h-[44vh] overflow-y-auto pr-1';
  const l=posList().filter(i=>!q||i.name.toLowerCase().includes(q)||(i.barcode&&i.barcode.toLowerCase().includes(q))).slice(0,60);
  g.innerHTML=l.map(i=>`<button ${i.qty<=0?'disabled':''} onclick="posAdd(${i.id})" class="text-left p-3 rounded-2xl border ${i.qty<=0?'bg-slate-100 opacity-50':'bg-white hover:border-[#0058c4] hover:shadow-md'} border-slate-200 transition active:scale-95"><div class="text-xs font-bold text-slate-800 leading-tight line-clamp-2">${pe(i.name)}</div><div class="text-sm font-extrabold text-[#0058c4] mt-1">${posRp(i.sellPrice)}</div><div class="text-[10px] ${i.qty<=0?'text-rose-500 font-bold':'text-slate-400'}">Stok ${+i.qty.toFixed(2)} ${pe(i.unit)}</div></button>`).join('')||'<div class="col-span-2 text-center text-xs text-slate-400 py-8">Barang tidak ditemukan. Tambah di menu Stok.</div>';
  return;}
 const isO=POS.view==='order',stages=isO?ORDER_STAGES:SERVICE_STAGES;
 g.className='grid grid-cols-1 gap-2 max-h-[44vh] overflow-y-auto pr-1';
 const src=(isO?appData.orders:appData.services).filter(r=>!q||[r.id,r.customerName,r.room,isO?r.orderType:r.notes].join(' ').toLowerCase().includes(q))
  .sort((a,b)=>(POS.paid.has(a.id)-POS.paid.has(b.id))||String(b.date).localeCompare(String(a.date)));
 g.innerHTML=src.map(r=>{const paid=POS.paid.has(r.id),inCart=POS.cart.some(c=>c.ref===r.id),stg=(stages[r.progress]||{}).title||'-';
  const badge=paid?'<span class="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 text-[10px] font-bold">Lunas</span>':inCart?'<span class="px-2 py-0.5 rounded-full bg-blue-100 text-blue-700 text-[10px] font-bold">Di keranjang</span>':`<span class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 text-[10px] font-bold">${pe(stg)}</span>`;
  return `<button ${paid||inCart?'disabled':''} onclick="posAddRef('${isO?'order':'service'}','${pe(r.id)}')" class="text-left p-3 rounded-2xl border ${paid||inCart?'bg-slate-100 opacity-60':'bg-white hover:border-[#0058c4] hover:shadow-md'} border-slate-200 transition active:scale-95">
   <div class="flex items-center justify-between gap-2"><span class="font-mono text-[11px] font-bold ${isO?'text-blue-700':'text-amber-600'}">${pe(r.id)}</span>${badge}</div>
   <div class="text-xs font-bold text-slate-800 mt-1 leading-tight">${pe(r.customerName)}<span class="font-medium text-slate-400"> &bull; ${pe(r.room||'-')}</span></div>
   <div class="flex items-end justify-between mt-1"><span class="text-[11px] text-slate-500">${isO?pe(r.orderType||'Pemesanan'):((r.items||[]).length+' item service')}</span><span class="text-sm font-extrabold text-[#0058c4]">${posRp(r.estimatedPrice)}</span></div></button>`;}).join('')
  ||`<div class="text-center text-xs text-slate-400 py-8">${isO?'Belum ada data pemesanan.':'Belum ada data service.'}</div>`;}
function posRenderCart(){const c=$p('posCart');if(!c)return;
 const tag={order:['PC','bg-blue-100 text-blue-700'],service:['SVC','bg-amber-100 text-amber-700'],manual:['LAIN','bg-slate-100 text-slate-600']};
 c.innerHTML=POS.cart.map((x,i)=>{const fixed=x.type==='order'||x.type==='service',tg=tag[x.type];
  const nm=`<div class="font-semibold">${tg?`<span class="px-1.5 py-0.5 rounded text-[9px] font-bold mr-1 ${tg[1]}">${tg[0]}</span>`:''}${pe(x.name)}</div>${x.sub&&x.sub.length?`<div class="text-[10px] text-slate-400 leading-tight">${pe(x.sub.slice(0,2).join(' \u2022 '))}${x.sub.length>2?' \u2026':''}</div>`:''}`;
  const qty=fixed?'<span class="font-bold text-slate-500">1</span>':`<button onclick="posQty(${i},-1)" class="w-6 h-6 rounded-lg bg-slate-100 font-bold">-</button><input type="number" min="1" value="${x.qty}" onchange="posSetQty(${i},this.value)" class="w-10 text-center border border-slate-200 rounded-lg py-0.5 font-bold"><button onclick="posQty(${i},1)" class="w-6 h-6 rounded-lg bg-slate-100 font-bold">+</button>`;
  const price=x.type==='stock'?posRp(x.price):`<button onclick="posEditPrice(${i})" class="underline decoration-dotted text-[#0058c4] font-semibold" title="Ubah harga">${posRp(x.price)}</button>`;
  return `<div class="grid grid-cols-12 gap-1 px-3 py-2 items-center text-xs border-t border-slate-100"><div class="col-span-5">${nm}</div>
  <div class="col-span-3 flex items-center justify-center gap-1">${qty}</div>
  <div class="col-span-2 text-right">${price}</div><div class="col-span-2 text-right font-bold">${posRp(x.qty*x.price)} <button onclick="posDel(${i})" class="text-rose-400 ml-1"><i class="fa-solid fa-xmark"></i></button></div></div>`;}).join('')
  ||'<div class="text-center text-slate-400 py-10 text-sm"><i class="fa-solid fa-basket-shopping text-2xl block mb-2"></i>Belum ada barang. Pilih barang, pesanan PC, atau service.</div>';
 const sub=posSub(),d=Math.min(POS.discount,sub);
 $p('posTotals').innerHTML=`<div class="bg-gradient-to-r from-[#003b87] to-[#0058c4] text-white rounded-2xl p-4 space-y-1"><div class="flex justify-between text-xs text-blue-200"><span>Subtotal</span><span>${posRp(sub)}</span></div><div class="flex justify-between text-xs text-blue-200"><span>Diskon</span><span>-${posRp(d)}</span></div><div class="flex justify-between items-end"><span class="text-xs font-bold">TOTAL</span><span class="text-3xl font-extrabold font-mono">${posRp(sub-d)}</span></div></div>`;
 if(POS.view!=='stock')posRenderGrid();}
function posAdd(id){const it=posList().find(i=>i.id===id);if(!it)return;if(!(it.sellPrice>0)){alert('Harga jual "'+it.name+'" belum diisi. Isi di menu Stok.');return;}
 const c=POS.cart.find(x=>x.type==='stock'&&x.id===id);const n=(c?c.qty:0)+1;if(n>it.qty+1e-9){alert('Stok '+it.name+' tidak cukup (sisa '+(+it.qty.toFixed(2))+').');return;}
 if(c)c.qty=n;else POS.cart.push({type:'stock',id,name:it.name,price:it.sellPrice,qty:1});posRenderCart();}
// Pesanan komputer / service -> keranjang kasir
function posAddRef(kind,id){const isO=kind==='order',r=(isO?appData.orders:appData.services).find(x=>x.id===id);if(!r)return;
 if(POS.paid.has(id)){alert(id+' sudah dibayar lewat Kasir.');return;}
 if(POS.cart.some(c=>c.ref===id))return;
 let price=Number(r.estimatedPrice)||0;
 if(!(price>0)){const v=prompt('Harga untuk '+id+' (Rp):','');if(v===null)return;price=Math.max(0,parseFloat(v)||0);if(!(price>0))return;}

async function posCheckout(){
 const s=POS.s,method=$p('posMethod').value,sub=posSub(),disc=Math.min(POS.discount,sub),total=sub-disc;
 const paid=method==='cash'?(parseFloat($p('posPaid').value)||0):total;
 if(paid<total){alert('Uang diterima kurang.');return;}
 const kas=method==='cash'?s.cashKas:(s.cashlessKas||s.cashKas);
 const stockLines=POS.cart.filter(c=>c.type==='stock');
 const w=posWalk();for(const c of stockLines){const st=(w[c.id]||{qty:0}).qty;if(c.qty>st+1e-9){alert('Stok '+c.name+' tidak cukup (sisa '+(+st.toFixed(2))+').');return;}}
 const dup=POS.cart.find(c=>c.ref&&POS.paid.has(c.ref));if(dup){alert(dup.ref+' sudah dibayar sebelumnya. Hapus dari keranjang.');return;}
 const btn=$p('posGo');btn.disabled=true;btn.innerText='Menyimpan...';
 const date=posToday();let txId=null;
 const undo=async()=>{if(txId){await finClient.from('inventory_moves').delete().eq('transaction_id',txId);await finClient.from('transactions').delete().eq('id',txId);}};
 try{
  const desc=('Kasir: '+POS.cart.map(c=>(c.ref?c.name+' #'+c.ref:c.name)+' x'+c.qty).join(', ')).slice(0,200);
  const a=await finClient.from('transactions').insert([{account:s.account,type:'in',date,description:desc,qty:1,category:'Penjualan',cash_type:kas,amount:total}]).select();
  if(a.error||!a.data||!a.data.length)throw new Error(a.error?a.error.message:'database tidak merespons');txId=a.data[0].id;
  const f=sub>0?total/sub:1;
  if(stockLines.length){const b=await finClient.from('inventory_moves').insert(stockLines.map(c=>({account:s.account,item_id:c.id,date,type:'out',qty:c.qty,unit_cost:0,unit_price:c.price*f,note:'Kasir',transaction_id:txId}))).select();
   if(b.error)throw new Error(b.error.message);}
  const items=POS.cart.map(c=>{const o={name:c.name,qty:c.qty,price:c.price,type:c.type};if(c.ref)o.ref=c.ref;if(c.sub&&c.sub.length)o.sub=c.sub;return o;});
  const c=await finClient.from('pos_sales').insert([{account:s.account,date,items,subtotal:sub,discount:disc,total,paid,change:paid-total,pay_method:method,cash_type:kas,cashier:s.cashier,transaction_id:txId}]).select();
  if(c.error||!c.data||!c.data.length)throw new Error(c.error?c.error.message:'database tidak merespons');
  POS.last={id:c.data[0].id,at:new Date(c.data[0].created_at||Date.now()),items,subtotal:sub,discount:disc,total,paid,change:paid-total,method};
  items.forEach(i=>{if(i.ref)POS.paid.add(i.ref);});
 }catch(err){await undo().catch(()=>{});alert('Transaksi GAGAL disimpan: '+err.message+'\n\nJika pesan menyebut tabel pos_sales, jalankan migrasi_kasir.sql.');posClose();return;}
 POS.cart=[];POS.discount=0;POS.q='';await posLoad();posLast(true);}

function posReceiptNo(s){return String(s.at.getFullYear()).slice(2)+'-200-'+String(s.id).padStart(6,'0');}
function posReceipt(sale){const c=Math.max(20,+POS.s.cols||32),L=[],p2=n=>String(n).padStart(2,'0');
 const wrap=(t,w)=>{w=w||c;const o=[];let l='';String(t).split(' ').forEach(x=>{while(x.length>w){if(l){o.push(l);l='';}o.push(x.slice(0,w));x=x.slice(w);}if((l+' '+x).trim().length>w){o.push(l);l=x;}else l=(l+' '+x).trim();});if(l)o.push(l);return o;};
 const ctr=t=>' '.repeat(Math.max(0,Math.floor((c-t.length)/2)))+t,lr=(l,r)=>{l=String(l);r=String(r);return l.length+r.length+1>c?l.slice(0,Math.max(0,c-r.length-1))+' '+r:l+' '.repeat(c-l.length-r.length)+r;},R=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
 const add=(t,b)=>L.push({t,b:!!b}),line=ch=>add(ch.repeat(c)),d=sale.at;
 // Kepala toko
 wrap(POS.s.store).forEach(x=>add(ctr(x),1));wrap(POS.s.addr).forEach(x=>add(ctr(x)));if(POS.s.phone)add(ctr('Telp. '+POS.s.phone));
 line('=');
 // Info transaksi
 add(lr('No. Struk',posReceiptNo(sale)));
 add(lr('Tanggal',p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear()));
 add(lr('Jam',p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())));
 add(lr('Kasir',POS.s.cashier));
 line('=');
 // Daftar item
 let n=0;sale.items.forEach((i,k)=>{n+=i.qty;wrap(i.name).forEach(x=>add(x,1));(i.sub||[]).forEach(s=>wrap(s,c-2).forEach(x=>add('  '+x)));add(lr(i.qty+' x '+R(i.price),R(i.qty*i.price)));if(k<sale.items.length-1)add('');});
 line('-');
 add(lr('Jumlah item',n));
 if(sale.discount>0){add(lr('Subtotal',R(sale.subtotal)));add(lr('Diskon','-'+R(sale.discount)));}
 line('=');
 add(lr('TOTAL',R(sale.total)),1);
 line('=');
 // Pembayaran
 add(lr(sale.method==='cash'?'Tunai':'Non-tunai',R(sale.paid)));
 if(sale.change>0)add(lr('Kembali',R(sale.change)),1);
 add('');add(ctr('TERIMA KASIH'),1);wrap(POS.s.footer).forEach(x=>add(ctr(x)));return L;}
function posReceiptHtml(sale){const L=posReceipt(sale),c=Math.max(20,+POS.s.cols||32);
 const logo=POS.s.showLogo!==false?`<img src="${POS_LOGO}" alt="" style="display:block;margin:0 auto 8px;width:24mm;height:auto">`:'';
 return `<div id="posReceiptPrint" class="pos-rcpt" style="--cols:${c};box-sizing:content-box;background:#fff;color:#000;width:${c}ch;padding:10px 12px;font:12px/1.35 'Courier New',Courier,monospace">${logo}<pre style="margin:0;font:inherit;white-space:pre">${L.map(x=>(x.b?'<b>':'')+pe(x.t)+(x.b?'</b>':'')).join('\n')}</pre></div>`;}

// Logo -> raster 1-bit (ESC/POS GS v 0), tengah, lebar 24mm
function posLogoBytes(){return new Promise(res=>{try{const im=new Image();
 im.onload=()=>{try{const cols=Math.max(20,+POS.s.cols||32),W=Math.floor(Math.min(192,cols*12-24)/8)*8,H=Math.round(im.naturalHeight*W/im.naturalWidth);
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,W,H);cx.drawImage(im,0,0,W,H);
  const px=cx.getImageData(0,0,W,H).data,wb=W/8,out=[];
  for(let y0=0;y0<H;y0+=96){const h=Math.min(96,H-y0);out.push(0x1D,0x76,0x30,0,wb&255,wb>>8,h&255,h>>8);
   for(let y=y0;y<y0+h;y++)for(let bx=0;bx<wb;bx++){let b=0;for(let k=0;k<8;k++){const p=(y*W+bx*8+k)*4,lum=.299*px[p]+.587*px[p+1]+.114*px[p+2];if(lum<205)b|=0x80>>k;}out.push(b);}}
  res(out);}catch(e){res([]);}};
 im.onerror=()=>res([]);im.src=POS_LOGO;}catch(e){res([]);}});}
async function posBytes(L){const o=[0x1B,0x40],enc=t=>[...t].map(ch=>ch.charCodeAt(0)<128?ch.charCodeAt(0):63);
 if(POS.s.showLogo!==false){const lg=await posLogoBytes();if(lg.length){o.push(0x1B,0x61,1);for(let i=0;i<lg.length;i++)o.push(lg[i]);o.push(0x1B,0x61,0,0x0A);}}
 L.forEach(x=>{if(x.b)o.push(0x1B,0x45,1);o.push(...enc(x.t),0x0A);if(x.b)o.push(0x1B,0x45,0);});o.push(0x1B,0x64,3);return new Uint8Array(o);}

async function posConnectBT(){if(!navigator.bluetooth){alert('Browser ini tidak mendukung Web Bluetooth. Gunakan Chrome/Edge.');return;}
 try{const dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:['000018f0-0000-1000-8000-00805f9b34fb','0000ff00-0000-1000-8000-00805f9b34fb','0000ffe0-0000-1000-8000-00805f9b34fb','e7810a71-73ae-499d-8c15-faa9aef0c3f2','49535343-fe7d-4ae5-8fa9-9fafd205e455']});
  const srv=await dev.gatt.connect();let ch=null;
  for(const sv of await srv.getPrimaryServices()){for(const c of await sv.getCharacteristics()){if(c.properties.write||c.properties.writeWithoutResponse){ch=c;break;}}if(ch)break;}
  if(!ch)throw new Error('Karakteristik tulis printer tidak ditemukan.');
  POS.printer={type:'Bluetooth',name:dev.name||'Printer BT',write:async b=>{for(let i=0;i<b.length;i+=100){const p=b.slice(i,i+100);if(ch.properties.writeWithoutResponse)await ch.writeValueWithoutResponse(p);else await ch.writeValue(p);await new Promise(r=>setTimeout(r,25));}}};
  dev.addEventListener('gattserverdisconnected',()=>{POS.printer=null;});
 }catch(e){if(e.name!=='NotFoundError')alert('Gagal menghubungkan: '+e.message);return;}posPrinterModal();}

function renderTabStok(){
 if(POS.err)return posErrBox();const l=posList(),tot=l.reduce((t,i)=>t+Math.max(0,i.qty)*i.avg,0);
 return `<div class="space-y-4"><div class="flex flex-wrap items-center justify-between gap-2"><div><h2 class="text-xl font-extrabold text-slate-800">Stok Barang</h2><p class="text-xs text-slate-500">Tersinkron otomatis dengan menu Stok di aplikasi Bendahara.</p></div>
  <div class="flex gap-2"><select onchange="posSetAccount(this.value);renderApp()" class="${INP} !w-auto !py-2 font-semibold">${POS.accounts.map(a=>`<option ${a===POS.s.account?'selected':''}>${pe(a)}</option>`).join('')}</select>
  <button onclick="posStokForm('new')" class="${BTN}bg-dcc-accent hover:bg-dcc-accentHover text-white"><i class="fa-solid fa-plus"></i> Barang</button></div></div>
  <div class="bg-gradient-to-r from-[#003b87] to-[#0058c4] text-white rounded-2xl p-4"><span class="text-[11px] text-blue-200 uppercase">Nilai Persediaan (HPP rata-rata)</span><div class="text-3xl font-extrabold font-mono">${posRp(tot)}</div></div>
  <div class="bg-white rounded-2xl border border-slate-200 overflow-x-auto"><table class="w-full text-xs"><thead class="bg-slate-50 text-slate-500 uppercase text-[10px]"><tr><th class="p-3 text-left">Barang</th><th class="p-3">Stok</th><th class="p-3 text-right">HPP</th><th class="p-3 text-right">Harga Jual</th><th class="p-3 text-right">Margin</th><th class="p-3"></th></tr></thead><tbody>
  ${l.map(i=>{const m=i.avg>0?(i.sellPrice-i.avg)/i.avg*100:null;return `<tr class="border-t border-slate-100"><td class="p-3 font-semibold">${pe(i.name)}<div class="text-[10px] text-slate-400">${i.barcode?pe(i.barcode):'tanpa barcode'}</div></td><td class="p-3 text-center font-bold ${i.qty<=0?'text-rose-500':''}">${+i.qty.toFixed(2)} ${pe(i.unit)}</td><td class="p-3 text-right">${posRp(i.avg)}</td><td class="p-3 text-right font-bold text-[#0058c4]">${posRp(i.sellPrice)}</td><td class="p-3 text-right ${m===null?'text-slate-400':m>=10?'text-emerald-600':'text-rose-500'} font-bold">${m===null?'-':m.toFixed(1)+'%'}</td>
  <td class="p-3 text-right whitespace-nowrap"><button onclick="posStokForm('buy',${i.id})" class="${BTN}bg-blue-100 text-blue-700">Beli</button> <button onclick="posStokForm('adj',${i.id})" class="${BTN}bg-amber-100 text-amber-700">Sesuaikan</button> <button onclick="posStokForm('edit',${i.id})" class="${BTN}bg-slate-100 text-slate-700">Edit</button></td></tr>`;}).join('')||'<tr><td colspan="6" class="p-8 text-center text-slate-400">Belum ada barang.</td></tr>'}</tbody></table></div></div>`;}
function posStokForm(mode,id){const it=POS.items.find(i=>i.id===id)||{},o=POS.opt[POS.s.account]||{out:{cashTypes:[]}};
 const f=(i,l,v,t)=>`<div><label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">${l}</label><input id="${i}" value="${pe(v==null?'':v)}" ${t||''} class="${INP}"></div>`;
 const kas=`<div><label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Dibayar dari kas</label><select id="sfKas" class="${INP}">${o.out.cashTypes.map(c=>`<option ${c===POS.s.cashKas?'selected':''}>${pe(c)}</option>`).join('')}</select></div>`;
 const title={new:'Barang Baru',edit:'Edit Barang',buy:'Beli Stok: '+(it.name||''),adj:'Penyesuaian: '+(it.name||'')}[mode];
 let body='';
 if(mode==='new'||mode==='edit')body=f('sfName','Nama',it.name,'required')+f('sfBar','Barcode (opsional)',it.barcode)+`<div class="grid grid-cols-2 gap-2">${f('sfUnit','Satuan',it.unit||'pcs')}${f('sfPrice','Harga jual (Rp)',it.sellPrice||'','type="number" min="0"')}</div>`+(mode==='new'?`<div class="text-[11px] font-bold text-slate-500 pt-1">Stok awal (opsional, tercatat sebagai pengeluaran)</div><div class="grid grid-cols-2 gap-2">${f('sfQty','Jumlah','','type="number" min="0" step="any"')}${f('sfCost','Harga beli/satuan','','type="number" min="0"')}</div>${kas}`:'');
 if(mode==='buy')body=`<div class="grid grid-cols-2 gap-2">${f('sfQty','Jumlah','','type="number" min="0" step="any"')}${f('sfCost','Harga beli/satuan',Math.round((posWalk()[id]||{avg:0}).avg)||'','type="number" min="0"')}</div>${kas}`;
 if(mode==='adj')body=f('sfQty','Selisih jumlah (minus = berkurang)','','type="number" step="any"')+f('sfNote','Catatan (wajib)','');
 posModal(`<div class="flex justify-between items-center"><h3 class="font-extrabold text-[#003b87]">${pe(title)}</h3><button onclick="posClose()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button></div><div class="space-y-2.5">${body}</div><button onclick="posStokSave('${mode}',${id||0})" class="w-full py-3 rounded-2xl bg-[#003b87] text-white font-bold text-sm">Simpan</button>`);}
async function posFinTx(row){const r=await finClient.from('transactions').insert([row]).select();if(r.error||!r.data||!r.data.length)throw new Error(r.error?r.error.message:'database tidak merespons');return r.data[0].id;}
async function posFinMove(row){const r=await finClient.from('inventory_moves').insert([row]).select();if(r.error)throw new Error(r.error.message);}
async function posBuy(itemId,name,qty,cost,kas){const d=posToday(),a=POS.s.account;let tx=null;
 try{tx=await posFinTx({account:a,type:'out',date:d,description:'Beli stok: '+name,qty,category:'Belanja Stok',cash_type:kas,amount:cost});
  await posFinMove({account:a,item_id:itemId,date:d,type:'in',qty,unit_cost:cost,unit_price:0,note:'',transaction_id:tx});}
 catch(e){if(tx)await finClient.from('transactions').delete().eq('id',tx);throw e;}}
async function posStokSave(mode,id){const g=i=>$p(i)?$p(i).value:'',a=POS.s.account;
 try{
  if(mode==='new'||mode==='edit'){const name=g('sfName').trim();if(!name){alert('Nama wajib diisi.');return;}
   const row={name,unit:g('sfUnit').trim()||'pcs',sell_price:parseFloat(g('sfPrice'))||0,barcode:g('sfBar').trim()||null};
   if(mode==='edit'){const r=await finClient.from('inventory_items').update(row).eq('id',id);if(r.error)throw new Error(r.error.message);}
   else{if(POS.items.some(i=>i.account===a&&i.name.toLowerCase()===name.toLowerCase())){alert('Nama barang sudah ada.');return;}
    const r=await finClient.from('inventory_items').insert([{...row,account:a}]).select();if(r.error||!r.data||!r.data.length)throw new Error(r.error?r.error.message:'database tidak merespons');
    const q=parseFloat(g('sfQty'))||0,c=parseFloat(g('sfCost'))||0;if(q>0){if(!(c>0)){alert('Isi harga beli untuk stok awal.');return;}await posBuy(r.data[0].id,name,q,c,g('sfKas'));}}}
  if(mode==='buy'){const q=parseFloat(g('sfQty')),c=parseFloat(g('sfCost')),it=POS.items.find(i=>i.id===id);if(!(q>0)||!(c>0)){alert('Isi jumlah dan harga beli.');return;}await posBuy(id,it.name,q,c,g('sfKas'));}
  if(mode==='adj'){const q=parseFloat(g('sfQty')),n=g('sfNote').trim();if(!q||!n){alert('Isi selisih jumlah dan catatan.');return;}
   const st=(posWalk()[id]||{qty:0}).qty;if(q<0&&-q>st+1e-9){alert('Stok tidak cukup (sisa '+(+st.toFixed(2))+').');return;}
   await posFinMove({account:a,item_id:id,date:posToday(),type:'adj',qty:q,unit_cost:0,unit_price:0,note:n});}
 }catch(e){alert('Gagal menyimpan: '+e.message+(/barcode/i.test(e.message)?'\n\nJalankan migrasi_kasir.sql untuk menambah kolom barcode.':''));return;}
 posClose();await posLoad();}

</script>
</body>
</html>
