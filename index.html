        /* ===== Cetak / Print: A4 dengan margin tetap, otomatis multi-halaman ===== */

        function formatRupiah(amount) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(amount || 0);

        function terbilang(nilai) {
            const angka = ["", "Satu", "Dua", "Tiga", "Empat", "Lima", "Enam", "Tujuh", "Delapan", "Sembilan", "Sepuluh", "Sebelas"];
            let n = Math.floor(Math.abs(nilai));
            if (n === 0) return "Nol Rupiah";

            function convert(num) {
                if (num < 12) {
                    return " " + angka[num];
                } else if (num < 20) {
                    return convert(num - 10) + " Belas";
                } else if (num < 100) {
                    return convert(Math.floor(num / 10)) + " Puluh" + convert(num % 10);
                } else if (num < 200) {
                    return " Seratus" + convert(num - 100);
                } else if (num < 1000) {
                    return convert(Math.floor(num / 100)) + " Ratus" + convert(num % 100);
                } else if (num < 2000) {
                    return " Seribu" + convert(num - 1000);
                } else if (num < 1000000) {
                    return convert(Math.floor(num / 1000)) + " Ribu" + convert(num % 1000);
                } else if (num < 1000000000) {
                    return convert(Math.floor(num / 1000000)) + " Juta" + convert(num % 1000000);
                } else if (num < 1000000000000) {
                    return convert(Math.floor(num / 1000000000)) + " Milyar" + convert(num % 1000000000);
                }
                return "";
            }

            return convert(n).trim() + " Rupiah";
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-blue-600';
            const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
            
            toast.className = `${bgClass} text-white px-4 py-3 rounded-2xl shadow-xl flex items-center gap-3 transition-all duration-300 transform translate-x-10 opacity-0 pointer-events-auto text-xs font-semibold`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-base"></i> <span>${message}</span>`;
            
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-x-10', 'opacity-0'));

            setTimeout(() => {
                toast.classList.add('translate-x-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

                            <p class="text-xs text-blue-200 font-medium mt-0.5">${record.customerName} &bull; ${record.room}</p>
                        </div>
                        <button id="resetSearchBtn" class="px-3.5 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-xs text-white border border-white/20 transition-all font-semibold flex items-center gap-2">

                            <div class="absolute left-0 top-1/2 -translate-y-1/2 h-1.5 bg-dcc-accent rounded-full z-0 transition-all duration-700 ease-in-out" style="width: ${(currentStep / (stages.length - 1)) * 100}%"></div>

                                const isCurrent = idx === currentStep;
                                return `
                                    <div class="relative z-10 flex flex-col items-center">
                                        <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-full flex items-center justify-center font-bold text-xs sm:text-sm transition-all duration-300 ${

                                        }">
                                            <i class="fa-solid ${stage.icon}"></i>
                                        </div>
                                        <div class="text-center mt-2 w-16 sm:w-20">
                                            <p class="text-[10px] font-bold ${isPassed ? 'text-slate-900' : 'text-slate-400'} line-clamp-1">${stage.title}</p>
                                        </div>
                                    </div>

                            }).join('')}

                            <div>
                                <span class="text-xs font-bold text-blue-900 uppercase">Status Terkini: ${stages[currentStep].title}</span>

                </div>
            `;

        // Kotak keuntungan (hanya untuk admin): keuntungan = estimasi harga - beban biaya
        function profitBoxHtml(record) {
            const cost = Number(record.costPrice) || 0;
            const profit = (Number(record.estimatedPrice) || 0) - cost;
            return `
                    <div class="flex justify-between items-center p-4 bg-emerald-50 border border-emerald-200 rounded-2xl">
                        <div>
                            <span class="block text-xs font-semibold text-emerald-800">Keuntungan</span>
                            <span class="block text-[10px] text-slate-500 mt-0.5">Beban biaya (pengeluaran): ${formatRupiah(cost)}</span>
                        </div>
                        <span class="text-lg font-bold font-mono ${profit >= 0 ? 'text-emerald-700' : 'text-rose-600'}">${formatRupiah(profit)}</span>
                    </div>`;
        }

        function renderCustomerOrderDetails(record, showProfit = false) {

                    <div class="flex justify-between items-center p-4 bg-[#003b87] text-white rounded-2xl shadow-sm">

        function renderCustomerServiceDetails(record, showProfit = false) {

                    ${record.kelengkapan ? `<div class="p-3.5 bg-blue-50 border border-blue-200 rounded-2xl text-xs text-blue-900"><strong><i class="fa-solid fa-box mr-1"></i>Kelengkapan:</strong> ${record.kelengkapan}</div>` : ''}

        // ==========================================
        // ADMIN DASHBOARD
        // ==========================================
        function renderAdminView() {

        function renderNavBtn(tabKey, label, icon) {
            const isActive = appData.activeTab === tabKey;
            return `
                <button onclick="switchAdminTab('${tabKey}')" class="flex-1 flex-shrink-0 justify-center whitespace-nowrap px-3.5 py-1.5 text-xs font-semibold rounded-xl transition-all duration-300 flex items-center gap-1.5 ${
                    isActive ? 'bg-white text-[#003b87] shadow-md font-bold scale-105' : 'text-blue-100 hover:bg-white/10'
                }">
                    <i class="fa-solid ${icon}"></i> <span class="hidden md:inline">${label}</span>
                </button>
            `;
        }

        function switchAdminTab(tabKey) {
            appData.activeTab = tabKey;
            renderApp();
            if (tabKey === 'harga') loadPriceList();
        }

        function renderAdminTabContent() {
            switch (appData.activeTab) {
                case 'beranda': return renderTabBeranda();
                case 'pemesanan': return renderTabPemesanan();
                case 'service': return renderTabService();
                case 'kasir': return renderTabKasir();
                case 'stok': return renderTabStok();
                case 'harga': return renderTabHarga();
                case 'transaksi': return renderTabTransaksi();
                case 'invoice': return renderTabInvoice();
                case 'riwayat': return renderTabRiwayat();
                case 'rekapan': return renderTabRekapan();
                default: return renderTabBeranda();
            }
        }

        function renderTabBeranda() {
            const totalOrders = appData.orders.length;
            const totalServices = appData.services.length;
            const orderIncome = appData.orders.reduce((acc, curr) => acc + (curr.estimatedPrice || 0), 0);
            const serviceIncome = appData.services.reduce((acc, curr) => acc + (curr.estimatedPrice || 0), 0);
            const totalGrandKas = orderIncome + serviceIncome;

            return `
                <div class="space-y-6">
                    <div class="bg-gradient-to-r from-[#003b87] to-[#0058c4] text-white p-6 sm:p-8 rounded-[24px] shadow-lg relative overflow-hidden space-y-4">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-medium text-blue-200 tracking-wide uppercase">Total Saldo Kas Akun Aktif</span>
                        </div>
                        <div>
                            <h2 class="text-3xl sm:text-4xl font-extrabold font-mono tracking-tight">${formatRupiah(totalGrandKas)}</h2>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                            <div class="bg-white/10 backdrop-blur-md p-3.5 rounded-2xl border border-white/10">
                                <span class="text-[11px] text-blue-200">Pemasukan Pemesanan</span>
                                <p class="text-base font-bold font-mono text-emerald-300 mt-0.5">${formatRupiah(orderIncome)}</p>
                            </div>
                            <div class="bg-white/10 backdrop-blur-md p-3.5 rounded-2xl border border-white/10">
                                <span class="text-[11px] text-blue-200">Pemasukan Service</span>
                                <p class="text-base font-bold font-mono text-amber-300 mt-0.5">${formatRupiah(serviceIncome)}</p>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="bg-blue-50/85 border border-blue-100 p-5 rounded-2xl flex items-center gap-4 hover-lift">
                            <div class="w-12 h-12 rounded-xl bg-blue-600 text-white flex items-center justify-center text-xl shadow-sm">
                                <i class="fa-solid fa-cart-shopping"></i>
                            </div>
                            <div>
                                <span class="text-[10px] font-bold uppercase text-slate-400 tracking-wider">Total Unit Pesanan</span>
                                <p class="text-xl font-extrabold text-blue-900 mt-0.5">${totalOrders} <span class="text-xs text-slate-500 font-normal">Unit</span></p>
                            </div>
                        </div>

                        <div class="bg-emerald-50/85 border border-emerald-100 p-5 rounded-2xl flex items-center gap-4 hover-lift">
                            <div class="w-12 h-12 rounded-xl bg-emerald-600 text-white flex items-center justify-center text-xl shadow-sm">
                                <i class="fa-solid fa-wrench"></i>
                            </div>
                            <div>
                                <span class="text-[10px] font-bold uppercase text-slate-400 tracking-wider">Total Unit Service</span>
                                <p class="text-xl font-extrabold text-emerald-900 mt-0.5">${totalServices} <span class="text-xs text-slate-500 font-normal">Unit</span></p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // ------------------------------------------
        // TAB PEMESANAN & SERVICE MANAGEMENT

                                        <th class="p-3.5">Progres</th>
                                        <th class="p-3.5 text-right">Estimasi Harga</th>
                                        <th class="p-3.5 text-center">Aksi</th>

                                </tbody>

                </div>
            `;
        }

        function renderOrderRows(ordersList) {
            if (ordersList.length === 0) return `<tr><td colspan="9" class="p-6 text-center text-slate-400">Belum ada data pemesanan.</td></tr>`;
            // Transaksi yang sudah Selesai ditaruh paling bawah (urutan lainnya tetap)
            const sortedOrders = [...ordersList].sort((a, b) => (a.progress === 4 ? 1 : 0) - (b.progress === 4 ? 1 : 0));
            return sortedOrders.map(item => {
                const done = item.progress === 4;
                return `
                <tr class="${done ? 'bg-emerald-50 hover:bg-emerald-100/70' : 'hover:bg-slate-50'} transition-colors">
                    <td class="p-3.5 font-mono font-bold text-blue-700 whitespace-nowrap">
                        <button onclick="viewOrderDetail('${item.id}')" class="hover:underline flex items-center gap-1">
                            <i class="fa-solid ${done ? 'fa-circle-check text-emerald-500' : 'fa-receipt text-slate-400'}"></i> ${item.id}
                        </button>
                    </td>
                    <td class="p-3.5 text-slate-500 whitespace-nowrap">${item.date}</td>
                    <td class="p-3.5 font-bold text-slate-800">${item.customerName}</td>
                    <td class="p-3.5 text-slate-600">${item.room}</td>
                    <td class="p-3.5 text-slate-600 font-mono whitespace-nowrap">${item.phone || '-'}</td>
                    <td class="p-3.5 text-slate-600 font-medium">${item.orderType}</td>
                    <td class="p-3.5 whitespace-nowrap">
                        <select onchange="updateOrderStatus('${item.id}', this.value)" class="px-2 py-1 rounded-lg text-xs font-bold ${done ? 'bg-emerald-100 border-emerald-300 text-emerald-800' : 'bg-slate-100 border-slate-200 text-slate-700'} border focus:outline-none">
                            ${ORDER_STAGES.map((stg, idx) => `<option value="${idx}" ${item.progress === idx ? 'selected' : ''}>${stg.title}</option>`).join('')}
                        </select>
                    </td>
                    <td class="p-3.5 text-right font-mono font-bold text-slate-700 whitespace-nowrap">${formatRupiah(item.estimatedPrice)}</td>
                    <td class="p-3.5 whitespace-nowrap">
                        <div class="flex items-center justify-center gap-1.5">
                            <button onclick="posSendToKasir('order', '${item.id}')" class="w-7 h-7 rounded-lg bg-blue-50 text-blue-600 hover:bg-blue-600 hover:text-white transition-all duration-300 hover:scale-110 flex items-center justify-center" title="Bayar di Kasir">
                                <i class="fa-solid fa-cash-register text-xs"></i>
                            </button>
                            <button onclick="openChatModal('order', '${item.id}')" class="w-7 h-7 rounded-lg bg-emerald-50 text-emerald-600 hover:bg-emerald-600 hover:text-white transition-all duration-300 hover:scale-110 flex items-center justify-center" title="Pratinjau / Salin Chat WA">
                                <i class="fa-brands fa-whatsapp text-sm"></i>
                            </button>
                            <button onclick="openOrderModal('${item.id}')" class="w-7 h-7 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all flex items-center justify-center" title="Edit">
                                <i class="fa-solid fa-pen-to-square text-xs"></i>
                            </button>
                            <button onclick="deleteOrder('${item.id}')" class="w-7 h-7 rounded-lg bg-rose-50 text-rose-600 hover:bg-rose-600 hover:text-white transition-all flex items-center justify-center" title="Hapus">
                                <i class="fa-solid fa-trash text-xs"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `;
            }).join('');
        }

        function filterOrderTable() {
            const val = document.getElementById('searchOrderInput').value.toLowerCase();
            const filtered = appData.orders.filter(o => o.id.toLowerCase().includes(val) || o.customerName.toLowerCase().includes(val) || o.room.toLowerCase().includes(val));

        function renderTabService() {

                <div class="space-y-6">

                        </div>
                        <button onclick="openServiceModal()" class="px-4 py-2 bg-dcc-accent hover:bg-dcc-accentHover text-white rounded-xl text-xs font-bold transition-all duration-300 hover:scale-105 flex items-center justify-center gap-2 shadow-md">

                                        <th class="p-3.5">Progres</th>
                                        <th class="p-3.5 text-right">Estimasi Biaya</th>
                                        <th class="p-3.5 text-center">Aksi</th>

                                </thead>
                                <tbody class="divide-y divide-slate-100" id="serviceTableBody">
                                    ${renderServiceRows(appData.services)}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderServiceRows(servicesList) {
            if (servicesList.length === 0) return `<tr><td colspan="9" class="p-6 text-center text-slate-400">Belum ada data service.</td></tr>`;

        // ==========================================
        // GENERATE INVOICE & KWITANSI PDF
        // (A4 otomatis menyesuaikan: 1 halaman rapi, atau multi-halaman bila item banyak)
        // ==========================================
        const DOC_PAGE_WIDTH_PX = 794; // lebar A4 (210mm) pada 96dpi
        const DOC_FONT = "'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif";

        function escapeHtml(value) {
            return String(value === undefined || value === null ? '' : value).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function formatTanggal(str) {
            if (!str) return '';
            const d = new Date(`${str}T00:00:00`);
            if (isNaN(d.getTime())) return escapeHtml(str);
            return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        // Normalisasi data baris tabel dari pesanan / service
        function getDocumentRows(dataItem, isOrder, subtotal) {
            if (isOrder) {
                if (dataItem.excelData && dataItem.excelData.length > 0) {
                    return dataItem.excelData.map(it => ({
                        name: it.component,
                        desc: it.spec,
                        qty: it.qty,
                        price: it.price,
                        total: (Number(it.qty) || 0) * (Number(it.price) || 0)
                    }));
                }
                return [{
                    name: dataItem.orderType || 'Pemesanan',
                    desc: `Paket Pemesanan ${dataItem.orderType || ''}`.trim(),
                    qty: 1, price: subtotal, total: subtotal
                }];
            }
            if (dataItem.items && dataItem.items.length > 0) {
                const n = dataItem.items.length;
                const base = Math.floor(subtotal / n);
                return dataItem.items.map((it, i) => {
                    const price = i === n - 1 ? subtotal - base * (n - 1) : base;
                    return { name: it.name, desc: it.issue ? `Kendala: ${it.issue}` : 'Perbaikan unit', qty: 1, price, total: price };
                });
            }
            return [{ name: 'Jasa Service', desc: 'Perbaikan Unit Hardware / Software', qty: 1, price: subtotal, total: subtotal }];
        }

        function docSignature(dateText) {
            return `
                <div style="text-align:center; width:190px; flex-shrink:0;">
                    <div style="font-size:11px; color:#475569;">Ponorogo, ${dateText}</div>
                    <div style="height:64px; position:relative; display:flex; align-items:center; justify-content:center; margin:4px 0;">

        // Skala pratinjau otomatis menyesuaikan lebar layar
        function fitDocPreview() {
            const viewport = document.getElementById('docViewport');
            const sizer = document.getElementById('docSizer');
            const paper = document.getElementById('docPaper');
            if (!viewport || !sizer || !paper) return;
            const cs = getComputedStyle(viewport);
            const avail = viewport.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
            if (avail <= 0) return;
            const scale = Math.min(1, avail / DOC_PAGE_WIDTH_PX);
            paper.style.transform = `scale(${scale})`;
            sizer.style.width = `${DOC_PAGE_WIDTH_PX * scale}px`;
            sizer.style.height = `${paper.offsetHeight * scale}px`;
        }
        window.addEventListener('resize', fitDocPreview);
        window.addEventListener('orientationchange', () => setTimeout(fitDocPreview, 200));

        // Tunggu font & gambar siap supaya hasil PDF tidak bergeser
        async function waitForDocAssets(element) {
            try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}
            const imgs = Array.from(element.querySelectorAll('img'));
            await Promise.all(imgs.map(img => img.complete ? Promise.resolve() : new Promise(res => { img.onload = img.onerror = res; })));
        }

        async function downloadDocumentPdf(filename) {
            const element = document.getElementById('printablePaper');
            if (!element) return;
            showToast('Menyiapkan berkas PDF A4...', 'info');

            try {
                await waitForDocAssets(element);

                const opt = {
                    // Margin dipasang di PDF (bukan padding) agar setiap halaman tetap rapi
                    margin:      [12, 15, 14, 15],
                    filename:    `${filename}.pdf`,
                    image:       { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', scrollX: 0, scrollY: 0 },
                    jsPDF:       { unit: 'mm', format: 'a4', orientation: 'portrait', compress: true },
                    pagebreak:   { mode: ['css', 'legacy'], avoid: ['tr', '.avoid-break'] }
                };

                await html2pdf().set(opt).from(element).save();
                showToast('PDF berhasil diunduh!', 'success');
            } catch (err) {
                console.error(err);
                showToast('Gagal membuat PDF. Coba lagi.', 'error');
            }
        }

        // Cetak langsung memakai salinan dokumen (tidak terpengaruh skala pratinjau)
        function printDocument() {
            const element = document.getElementById('printablePaper');
            if (!element) return;
            const old = document.getElementById('printHost');
            if (old) old.remove();

            const host = document.createElement('div');
            host.id = 'printHost';
            const copy = element.cloneNode(true);
            copy.removeAttribute('id');
            host.appendChild(copy);
            document.body.appendChild(host);
            document.body.classList.add('printing');

            const cleanup = () => {
                document.body.classList.remove('printing');
                host.remove();
                window.removeEventListener('afterprint', cleanup);
            };
            window.addEventListener('afterprint', cleanup);
            setTimeout(() => window.print(), 80);
        }

                </div>
            `);

                window.tempExcelParsed = record.excelData.map(r => ({ component: r.component || '', spec: r.spec || '', qty: Number(r.qty) || 0, price: Number(r.price) || 0 }));
                renderExcelPreviewTable(record.excelData);
            } else {
                window.tempExcelParsed = [];
                renderExcelPreviewTable([]);
            }
            recalcOrderTotal();
        }

        function handleExcelPaste(e) {
            e.preventDefault();
            const clipboardData = (e.clipboardData || window.clipboardData).getData('text');
            if (!clipboardData) return;
            const rows = clipboardData.trim().split(/\r\n|\n|\r/);
            const parsedItems = [];
            let calculatedTotal = 0;

            rows.forEach(rowStr => {
                const cols = rowStr.split('\t');
                if (cols.length >= 2) {
                    const component = cols[0] ? cols[0].trim() : 'Komponen';
                    const spec = cols[1] ? cols[1].trim() : '-';
                    const qty = cols[2] && !isNaN(parseInt(cols[2])) ? parseInt(cols[2]) : 1;
                    let price = cols[3] ? parseInt(cols[3].replace(/[^0-9]/g, '')) || 0 : 0;
                    parsedItems.push({ component, spec, qty, price });
                    calculatedTotal += (qty * price);
                }
            });

            window.tempExcelParsed = parsedItems;
            renderExcelPreviewTable(parsedItems);
            recalcOrderTotal();
            showToast(`Berhasil mengonversi ${parsedItems.length} baris Excel!`, 'success');
        }

        function renderExcelPreviewTable(items) {
            const tbody = document.getElementById('excelPreviewBody');
            if (!tbody) return;
            if (items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-3 text-center text-slate-400 text-xs">Belum ada komponen. Paste dari Excel atau klik "Tambah Baris".</td></tr>`;
                return;
            }
            const inp = 'w-full px-2 py-1.5 text-[11px] border border-slate-200 rounded-lg outline-none focus:border-blue-400 bg-white';
            tbody.innerHTML = items.map((it, i) => `
                <tr class="hover:bg-slate-50 align-middle">
                    <td class="p-1.5 min-w-[110px]"><input type="text" value="${escapeHtml(it.component)}" placeholder="Komponen" oninput="updExcelRow(${i},'component',this.value)" class="${inp} font-semibold"></td>
                    <td class="p-1.5 min-w-[170px]"><input type="text" value="${escapeHtml(it.spec)}" placeholder="Spesifikasi" oninput="updExcelRow(${i},'spec',this.value)" class="${inp}"></td>
                    <td class="p-1.5 w-16"><input type="number" min="0" value="${Number(it.qty) || 0}" oninput="updExcelRow(${i},'qty',this.value)" class="${inp} text-center"></td>
                    <td class="p-1.5 w-28"><input type="number" min="0" value="${Number(it.price) || 0}" oninput="updExcelRow(${i},'price',this.value)" class="${inp} text-right"></td>
                    <td id="excelSub${i}" class="p-1.5 text-right font-bold font-mono whitespace-nowrap">${formatRupiah((Number(it.qty) || 0) * (Number(it.price) || 0))}</td>
                    <td class="p-1.5 text-center"><button type="button" onclick="delExcelRow(${i})" title="Hapus baris" class="w-7 h-7 rounded-lg bg-rose-50 text-rose-500 hover:bg-rose-600 hover:text-white transition-all"><i class="fa-solid fa-trash text-[10px]"></i></button></td>
                </tr>
            `).join('');
        }

        function updExcelRow(i, key, val) {
            const row = (window.tempExcelParsed || [])[i];
            if (!row) return;
            row[key] = (key === 'qty' || key === 'price') ? Math.max(0, parseFloat(val) || 0) : val;
            const sc = document.getElementById('excelSub' + i);
            if (sc) sc.textContent = formatRupiah((Number(row.qty) || 0) * (Number(row.price) || 0));
            recalcOrderTotal();
        }

        function addExcelRow() {
            window.tempExcelParsed = window.tempExcelParsed || [];
            window.tempExcelParsed.push({ component: '', spec: '', qty: 1, price: 0 });
            renderExcelPreviewTable(window.tempExcelParsed);
            recalcOrderTotal();
            const rows = document.querySelectorAll('#excelPreviewBody tr');
            const last = rows[rows.length - 1];
            if (last) { last.scrollIntoView({ block: 'nearest' }); const f = last.querySelector('input'); if (f) f.focus(); }
        }

        function delExcelRow(i) {
            if (!window.tempExcelParsed) return;
            window.tempExcelParsed.splice(i, 1);
            renderExcelPreviewTable(window.tempExcelParsed);
            recalcOrderTotal();
        }

        // Total harga otomatis = jumlah (Qty x Harga) semua baris. Bila tabel kosong, total boleh diisi manual.
        function recalcOrderTotal() {
            const items = window.tempExcelParsed || [];
            const el = document.getElementById('ordPrice');
            if (!el) return;
            const hint = document.getElementById('ordPriceHint');
            if (items.length > 0) {
                el.value = items.reduce((t, r) => t + (Number(r.qty) || 0) * (Number(r.price) || 0), 0);
                el.readOnly = true;
                el.classList.add('bg-slate-100');
                if (hint) hint.textContent = '(otomatis dari tabel)';
            } else {
                el.readOnly = false;
                el.classList.remove('bg-slate-100');
                if (hint) hint.textContent = '(isi manual)';
            }
            updProfit('ordPrice', 'ordCost', 'ordProfitInfo');
        }

        // Pesan galat simpan: beri petunjuk migrasi bila kolom di Supabase belum ada
        function saveErrMsg(err) {
            const m = (err && err.message) || '';
            if (/receiver_name/.test(m)) return 'Kolom receiver_name belum ada. Jalankan migrasi_nama_penerima.sql di Supabase dulu.';
            if (/cost_price/.test(m)) return 'Kolom cost_price belum ada. Jalankan migrasi_beban_biaya.sql di Supabase dulu.';
            return 'Gagal menyimpan: ' + m;
        }

        async function saveOrderForm(e, editId) {
            e.preventDefault();
            const idVal = document.getElementById('ordId').value;
            const dateVal = document.getElementById('ordDate').value || getTodayDateString();
            const customerNameVal = document.getElementById('ordCustomer').value;
            const roomVal = document.getElementById('ordRoom').value;
            const phoneVal = document.getElementById('ordPhone').value;
            const receiverVal = document.getElementById('ordReceiver').value.trim();
            const orderTypeVal = document.getElementById('ordType').value;
            const _req = [[customerNameVal, 'Nama pelanggan', 'ordCustomer'], [roomVal, 'Kamar / bagian', 'ordRoom'], [phoneVal, 'No. WhatsApp', 'ordPhone'], [orderTypeVal, 'Jenis pesanan', 'ordType'], [receiverVal, 'Nama penerima', 'ordReceiver'], [document.getElementById('ordCost').value, 'Beban biaya / harga beli', 'ordCost']];
            for (const [v, lbl, fid] of _req) { if (!String(v).trim()) { showToast(lbl + ' wajib diisi!', 'error'); const f = document.getElementById(fid); if (f) f.focus(); return; } }
            const priceVal = parseInt(document.getElementById('ordPrice').value) || 0;
            const costVal = Math.max(0, parseInt(document.getElementById('ordCost').value) || 0);
            if (costVal > 0 && costVal >= priceVal) {
                showToast('Beban biaya harus lebih kecil dari estimasi total harga!', 'error');
                return;
            }
            const excelDataVal = (window.tempExcelParsed || []).filter(r => (r.component || '').trim() || (r.spec || '').trim() || Number(r.price) > 0);

            const dbPayload = {
                id: idVal,
                date: dateVal,
                customer_name: customerNameVal,
                room: roomVal,
                phone: phoneVal,
                receiver_name: receiverVal,
                order_type: orderTypeVal,
                estimated_price: priceVal,
                cost_price: costVal,
                excel_data: excelDataVal
            };

            if (supabaseClient) {
                let res;
                if (editId) {
                    res = await supabaseClient.from('orders').update(dbPayload).eq('id', editId);
                } else {
                    dbPayload.progress = 0;
                    res = await supabaseClient.from('orders').insert([dbPayload]);
                }

                if (res.error) {
                    console.error("Error Simpan Order Supabase:", res.error);
                    showToast(saveErrMsg(res.error), 'error');
                    return;
                }
                await loadSupabaseData();
            } else {
                if (editId) {
                    const idx = appData.orders.findIndex(o => o.id === editId);

                        appData.orders[idx] = { ...appData.orders[idx], date: dateVal, customerName: customerNameVal, room: roomVal, phone: phoneVal, receiver: receiverVal, orderType: orderTypeVal, estimatedPrice: priceVal, costPrice: costVal, excelData: excelDataVal };

                    appData.orders.unshift({ id: idVal, date: dateVal, customerName: customerNameVal, room: roomVal, phone: phoneVal, receiver: receiverVal, orderType: orderTypeVal, estimatedPrice: priceVal, costPrice: costVal, progress: 0, excelData: excelDataVal });

                renderApp();
            }
            closeModal();
            showToast('Data pemesanan berhasil disimpan!', 'success');
        }

        // ==========================================
        // DAFTAR HARGA (barang & jasa service)
        // ==========================================
        const PRICE_LS_KEY = 'dcc_price_list_local';
        const PRICE = { items: [], mode: 'cloud', loaded: false, q: '', cat: 'all', sort: 'name', err: '' };
        const PRICE_SQL = `create table if not exists public.price_list (
  id bigint generated by default as identity primary key,
  name text not null,
  category text not null default 'Jasa',
  unit text default '',
  price numeric not null default 0,
  note text default '',
  created_at timestamptz default now()
);
alter table public.price_list enable row level security;
drop policy if exists "price_list_all" on public.price_list;
create policy "price_list_all" on public.price_list for all using (true) with check (true);
do $$ begin alter publication supabase_realtime add table public.price_list; exception when others then null; end $$;`;
        const PICK = { q: '', cat: 'all', picked: [] };

        function priceReadLocal() {
            try { return JSON.parse(localStorage.getItem(PRICE_LS_KEY) || '[]'); } catch (e) { return []; }
        }
        function priceWriteLocal() {
            try { localStorage.setItem(PRICE_LS_KEY, JSON.stringify(PRICE.items)); } catch (e) {}
        }

        async function loadPriceList() {
            let cloudOk = false;
            if (supabaseClient) {
                try {
                    const { data, error } = await supabaseClient.from('price_list').select('*').order('name', { ascending: true });
                    if (!error && data) {
                        PRICE.items = data.map(r => ({ id: String(r.id), name: r.name || '', category: r.category || 'Jasa', unit: r.unit || '', price: Number(r.price) || 0, note: r.note || '' }));
                        PRICE.mode = 'cloud';
                        PRICE.err = '';
                        cloudOk = true;
                    } else if (error) {
                        PRICE.err = error.message || String(error.code || 'error');
                        console.warn('Tabel price_list belum siap, memakai penyimpanan lokal:', error.message);
                    }
                } catch (e) { PRICE.err = String(e.message || e); console.warn('Gagal memuat daftar harga:', e); }
            }
            if (!cloudOk) {
                PRICE.mode = 'local';
                PRICE.items = priceReadLocal();
            }
            PRICE.loaded = true;
            if (appData.activeTab === 'harga') renderApp();
            pickRenderList();
        }

        function priceFiltered() {
            const kw = PRICE.q.trim().toLowerCase();
            let list = PRICE.items.filter(i => {
                if (PRICE.cat !== 'all' && i.category !== PRICE.cat) return false;
                if (!kw) return true;
                return [i.name, i.unit, i.note, i.category].some(v => String(v || '').toLowerCase().includes(kw));
            });
            if (PRICE.sort === 'low') list.sort((a, b) => a.price - b.price);
            else if (PRICE.sort === 'high') list.sort((a, b) => b.price - a.price);
            else list.sort((a, b) => a.name.localeCompare(b.name, 'id'));
            return list;
        }

        function priceCatBadge(cat) {
            return cat === 'Barang'
                ? '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-blue-100 text-blue-700">Barang</span>'
                : '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-100 text-amber-700">Jasa</span>';
        }

        function renderPriceRows(list) {
            if (list.length === 0) {
                return `<tr><td colspan="6" class="p-8 text-center text-slate-400">${PRICE.items.length === 0 ? 'Belum ada daftar harga. Klik "Tambah Harga" untuk mulai.' : 'Tidak ada data yang cocok dengan pencarian/filter.'}</td></tr>`;
            }
            return list.map(i => `
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="p-3.5 font-bold text-slate-800">${escapeHtml(i.name)}</td>
                    <td class="p-3.5 whitespace-nowrap">${priceCatBadge(i.category)}</td>
                    <td class="p-3.5 text-slate-600 whitespace-nowrap">${escapeHtml(i.unit) || '-'}</td>
                    <td class="p-3.5 text-right font-mono font-bold text-slate-700 whitespace-nowrap">${formatRupiah(i.price)}</td>
                    <td class="p-3.5 text-slate-500">${escapeHtml(i.note) || '-'}</td>
                    <td class="p-3.5 whitespace-nowrap">
                        <div class="flex items-center justify-center gap-1.5">
                            <button onclick="openPriceModal('${i.id}')" class="w-7 h-7 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all flex items-center justify-center" title="Edit">

                            </button>
                            <button onclick="deletePriceItem('${i.id}')" class="w-7 h-7 rounded-lg bg-rose-50 text-rose-600 hover:bg-rose-600 hover:text-white transition-all flex items-center justify-center" title="Hapus">
                                <i class="fa-solid fa-trash text-xs"></i>
                            </button>
                        </div>
                    </td>
                </tr>

        async function savePriceForm(e, editId) {
            e.preventDefault();
            const name = document.getElementById('prcName').value.trim();
            const category = document.getElementById('prcCat').value;
            const unit = document.getElementById('prcUnit').value.trim();
            const price = Math.max(0, parseInt(document.getElementById('prcPrice').value) || 0);
            const note = document.getElementById('prcNote').value.trim();
            if (!name) { showToast('Nama wajib diisi!', 'error'); return; }
            const dup = PRICE.items.some(i => i.id !== editId && i.category === category && i.name.toLowerCase() === name.toLowerCase());
            if (dup) { showToast('Nama tersebut sudah ada di kategori yang sama!', 'error'); return; }

            if (PRICE.mode === 'cloud' && supabaseClient) {
                const payload = { name, category, unit, price, note };
                const res = editId
                    ? await supabaseClient.from('price_list').update(payload).eq('id', editId)
                    : await supabaseClient.from('price_list').insert([payload]);
                if (res.error) { showToast('Gagal menyimpan: ' + res.error.message + (/row-level|policy|permission/i.test(res.error.message) ? ' (jalankan ulang SQL daftar harga di Supabase)' : ''), 'error'); return; }
                await loadPriceList();
            } else {
                if (editId) {
                    const idx = PRICE.items.findIndex(i => i.id === editId);
                    if (idx !== -1) PRICE.items[idx] = { ...PRICE.items[idx], name, category, unit, price, note };
                } else {
                    PRICE.items.push({ id: 'L' + Date.now(), name, category, unit, price, note });
                }
                priceWriteLocal();
                if (appData.activeTab === 'harga') renderApp();
                pickRenderList();
            }
            closeModal();
            showToast('Daftar harga berhasil disimpan!', 'success');
        }

        async function deletePriceItem(id) {
            const rec = PRICE.items.find(i => i.id === id);
            if (!rec) return;
            if (!confirm(`Yakin ingin menghapus "${rec.name}" dari daftar harga?`)) return;
            if (PRICE.mode === 'cloud' && supabaseClient) {
                const res = await supabaseClient.from('price_list').delete().eq('id', id);
                if (res.error) { showToast('Gagal menghapus: ' + res.error.message, 'error'); return; }
                await loadPriceList();
            } else {
                PRICE.items = PRICE.items.filter(i => i.id !== id);
                priceWriteLocal();
                if (appData.activeTab === 'harga') renderApp();
                pickRenderList();
            }
            showToast('Item harga dihapus.', 'info');
        }

        async function priceMigrateLocal() {
            const local = priceReadLocal();
            if (!local.length || !supabaseClient) return;
            const rows = local.map(i => ({ name: i.name, category: i.category, unit: i.unit || '', price: i.price || 0, note: i.note || '' }));
            const res = await supabaseClient.from('price_list').insert(rows);
            if (res.error) { showToast('Gagal memindahkan: ' + res.error.message, 'error'); return; }
            try { localStorage.removeItem(PRICE_LS_KEY); } catch (e) {}
            await loadPriceList();
            showToast(`${rows.length} data harga dipindahkan ke cloud.`, 'success');
        }


        async function priceCopySql() {
            try { await navigator.clipboard.writeText(PRICE_SQL); showToast('SQL disalin. Tempel di Supabase SQL Editor lalu Run.', 'success'); }
            catch (e) {
                const ta = document.createElement('textarea'); ta.value = PRICE_SQL; document.body.appendChild(ta); ta.select();
                try { document.execCommand('copy'); showToast('SQL disalin. Tempel di Supabase SQL Editor lalu Run.', 'success'); } catch (e2) { showToast('Gagal menyalin SQL.', 'error'); }
                ta.remove();
            }
        }

        async function priceRecheck() {
            await loadPriceList();
            showToast(PRICE.mode === 'cloud' ? 'Tersambung ke cloud!' : 'Masih belum tersambung. Pastikan SQL sudah dijalankan.', PRICE.mode === 'cloud' ? 'success' : 'error');
        }

        function priceExport() {
            const data = PRICE.items.map(i => ({ name: i.name, category: i.category, unit: i.unit, price: i.price, note: i.note }));
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `daftar-harga-dcc-${getTodayDateString()}.json`;
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
            showToast(`${data.length} item diekspor.`, 'success');
        }

        async function priceImport(input) {
            const file = input.files && input.files[0];
            input.value = '';
            if (!file) return;
            let arr;
            try { arr = JSON.parse(await file.text()); } catch (e) { showToast('File bukan JSON yang valid.', 'error'); return; }
            if (!Array.isArray(arr)) { showToast('Format file tidak dikenali.', 'error'); return; }
            const exists = new Set(PRICE.items.map(i => i.category + '|' + i.name.toLowerCase()));
            const rows = [];
            arr.forEach(r => {
                const name = String((r && r.name) || '').trim();
                if (!name) return;
                const category = r.category === 'Barang' ? 'Barang' : 'Jasa';
                const key = category + '|' + name.toLowerCase();
                if (exists.has(key)) return;
                exists.add(key);
                rows.push({ name, category, unit: String(r.unit || ''), price: Math.max(0, Number(r.price) || 0), note: String(r.note || '') });
            });
            if (rows.length === 0) { showToast('Tidak ada data baru untuk diimpor.', 'info'); return; }
            if (PRICE.mode === 'cloud' && supabaseClient) {
                const res = await supabaseClient.from('price_list').insert(rows);
                if (res.error) { showToast('Gagal impor: ' + res.error.message, 'error'); return; }
                await loadPriceList();
            } else {
                rows.forEach((r, k) => PRICE.items.push({ id: 'L' + Date.now() + k, ...r }));
                priceWriteLocal();
                if (appData.activeTab === 'harga') renderApp();
            }
            showToast(`${rows.length} item berhasil diimpor.`, 'success');
        }

            `;
            pickRenderList();
        }

        function pickFiltered() {
            const kw = PICK.q.trim().toLowerCase();
            return PRICE.items
                .filter(i => (PICK.cat === 'all' || i.category === PICK.cat) && (!kw || [i.name, i.unit, i.note].some(v => String(v || '').toLowerCase().includes(kw))))
                .sort((a, b) => a.name.localeCompare(b.name, 'id'));
        }

        function pickRenderList() {
            const box = document.getElementById('pickList');
            if (!box) return;
            const list = pickFiltered();

                box.innerHTML = `<div class="p-4 text-center text-xs text-slate-400">${PRICE.items.length === 0 ? 'Belum ada daftar harga. Tambahkan dulu di menu Harga.' : 'Tidak ada yang cocok.'}</div>`;
                return;
            }
            box.innerHTML = list.map(i => `
                <button type="button" onclick="pickPrice('${i.id}')" class="w-full flex items-center justify-between gap-3 px-3 py-2 bg-white hover:bg-blue-50 border border-slate-200 rounded-xl text-left transition-all">
                    <span class="min-w-0">
                        <span class="block text-xs font-bold text-slate-800 truncate">${escapeHtml(i.name)}</span>
                        <span class="block text-[10px] text-slate-500">${escapeHtml(i.category === 'Jasa' ? 'Jasa' : 'Barang')}${i.unit ? ' &bull; ' + escapeHtml(i.unit) : ''}</span>
                    </span>
                    <span class="flex items-center gap-2 flex-shrink-0">

                        <i class="fa-solid fa-circle-plus text-emerald-500"></i>
                    </span>
                </button>
            `).join('');
        }

        function pickOnSearch(v) { PICK.q = v; pickRenderList(); }
        function pickSetCat(c) { PICK.cat = c; pickRenderPanel(); }

        function pickPrice(id) {
            const item = PRICE.items.find(i => i.id === id);
            const input = document.getElementById('svcPrice');
            if (!item || !input) return;
            input.value = (parseInt(input.value) || 0) + item.price;
            PICK.picked.push({ uid: Date.now() + Math.random(), name: item.name, price: item.price });
            pickRenderChips();
            updProfit('svcPrice', 'svcCost', 'svcProfitInfo');
        }

        function pickRemove(uid) {
            const idx = PICK.picked.findIndex(p => p.uid === uid);
            const input = document.getElementById('svcPrice');
            if (idx === -1 || !input) return;
            input.value = Math.max(0, (parseInt(input.value) || 0) - PICK.picked[idx].price);
            PICK.picked.splice(idx, 1);
            pickRenderChips();
            updProfit('svcPrice', 'svcCost', 'svcProfitInfo');
        }

        function pickRenderChips() {
            const box = document.getElementById('pricePickedChips');
            if (!box) return;
            if (PICK.picked.length === 0) { box.innerHTML = ''; return; }
            const total = PICK.picked.reduce((t, p) => t + p.price, 0);
            box.innerHTML = `
                <div class="p-3 rounded-xl bg-blue-50 border border-blue-200 space-y-2">
                    <div class="flex items-center justify-between text-[11px]">
                        <span class="font-bold text-blue-800">Dipilih dari Daftar Harga</span>
                        <span class="font-mono font-extrabold text-blue-800">${formatRupiah(total)}</span>
                    </div>
                    <div class="flex flex-wrap gap-1.5">
                        ${PICK.picked.map(p => `<span class="inline-flex items-center gap-1.5 pl-2.5 pr-1.5 py-1 rounded-full bg-white border border-blue-200 text-[11px] font-semibold text-slate-700">${escapeHtml(p.name)} <span class="font-mono text-[#0058c4]">+${formatRupiah(p.price)}</span><button type="button" onclick="pickRemove(${p.uid})" class="w-4 h-4 rounded-full text-rose-500 hover:bg-rose-100 flex items-center justify-center" title="Batalkan"><i class="fa-solid fa-xmark text-[9px]"></i></button></span>`).join('')}
                    </div>
                </div>`;
        }

        window.addEventListener('DOMContentLoaded', async () => {
            setTimeout(()=>{if(typeof posAutoUSB==='function')posAutoUSB().then(()=>posAutoSerial()).then(()=>posStationStart());},1200);
            renderApp();
            loadPriceList();
            if (supabaseClient) {
                await loadSupabaseData();
                initRealtimeSubscription();
            }
        });
    </script>

  if(m.type==='in'){const nq=it.qty+m.qty;it.avg=nq>0?(it.qty*it.avg+m.qty*m.unitCost)/nq:m.unitCost;it.qty=nq;}
  else if(m.type==='out')it.qty-=m.qty;else it.qty+=m.qty;});
 return items;}

 if(!finClient){POS.err='Library Supabase tidak termuat.';POS.loaded=true;return posRefreshAll();}
 const r=await Promise.all([finClient.from('accounts').select('name,options').order('id'),finClient.from('inventory_items').select('*').order('id'),finClient.from('inventory_moves').select('*').order('id')]);
 const bad=r.find(x=>x.error);
 if(bad){POS.err=bad.error.message;POS.loaded=true;return posRefreshAll();}
 POS.err='';POS.accounts=r[0].data.map(a=>a.name);POS.opt={};
 r[0].data.forEach(a=>{let o=a.options;if(typeof o==='string'){try{o=JSON.parse(o)}catch(e){o=null}}POS.opt[a.name]=o&&o.in&&o.out?o:{in:{cashTypes:[]},out:{cashTypes:[]}};});
 POS.items=r[1].data.map(i=>({id:i.id,account:i.account,name:i.name,unit:i.unit||'pcs',sellPrice:Number(i.sell_price||0),barcode:i.barcode||'',editor:i.editor||''}));
 POS.moves=r[2].data.map(m=>({id:m.id,account:m.account,itemId:m.item_id,date:m.date,type:m.type,qty:Number(m.qty),unitCost:Number(m.unit_cost||0)}));
 if(!POS.accounts.includes(POS.s.account))POS.s.account=POS.accounts[0]||'';
 POS.cart=POS.cart.filter(c=>c.type!=='stock'||POS.items.some(i=>i.id===c.id));
 try{const pr=await finClient.from('pos_sales').select('items').order('id',{ascending:false}).limit(2000);
  if(!pr.error&&pr.data){const ps=new Set();pr.data.forEach(r=>(r.items||[]).forEach(i=>{if(i&&i.ref)ps.add(i.ref);}));POS.paid=ps;POS.cart=POS.cart.filter(c=>!c.ref||!ps.has(c.ref));}}catch(e){}
 POS.loaded=true;if(!POS.rt)posRealtime();posRefreshAll();posQueueLoad();}

const QR=(()=>{

 const EC={1:[10,1,16,0,0],2:[16,1,28,0,0],3:[26,1,44,0,0],4:[18,2,32,0,0],5:[24,2,43,0,0],6:[16,4,27,0,0],7:[18,4,31,0,0],8:[22,2,38,2,39],9:[22,3,36,2,37],10:[26,4,43,1,44]};

  const maxd=Math.max(e[2],e[4]);for(let i=0;i<maxd;i++)blocks.forEach(b=>{if(i<b.length)fin.push(b[i]);});

  const finder=(r,c)=>{for(let i=-1;i<=7;i++)for(let j=-1;j<=7;j++){const d=i>=0&&i<=6&&j>=0&&j<=6&&(i==0||i==6||j==0||j==6||(i>=2&&i<=4&&j>=2&&j<=4));set(r+i,c+j,d);}};

  close:async()=>{try{w.releaseLock();}catch(e){}try{await port.close();}catch(e){}}};
 try{port.addEventListener('disconnect',()=>{POS.printer=null;posPrinterLabel();});}catch(e){}
 posPrinterLabel();}
async function posConnectSerial(){if(!navigator.serial){alert('Browser ini tidak mendukung Web Serial. Gunakan Chrome atau Edge di PC.');return;}
 try{const port=await navigator.serial.requestPort();if(POS.printer)await posDisconnect(true);await posSerialUse(port);}
 catch(e){if(e.name==='NotFoundError')return;alert('Gagal menghubungkan: '+e.message+'\n\nPastikan printer menyala, sudah di-pair di Windows, dan tidak dipakai aplikasi/tab lain.');return;}
 posPrinterModal();}
async function posUsbUse(dev){
 await dev.open();
 if(dev.configuration===null)await dev.selectConfiguration(1);
 let pick=null;
 for(const itf of dev.configuration.interfaces){for(const alt of itf.alternates){
  const out=alt.endpoints.find(e=>e.direction==='out'&&e.type==='bulk');
  if(out&&(!pick||alt.interfaceClass===7))pick={itf:itf.interfaceNumber,alt:alt.alternateSetting,ep:out.endpointNumber};}}
 if(!pick){try{await dev.close();}catch(e){}throw new Error('Port tulis (bulk OUT) tidak ditemukan pada perangkat ini. Pastikan yang dipilih adalah printer.');}
 await dev.claimInterface(pick.itf);
 if(pick.alt)try{await dev.selectAlternateInterface(pick.itf,pick.alt);}catch(e){}
 POS.printer={type:'USB',name:dev.productName||'Printer USB',dev,
  write:async b=>{for(let i=0;i<b.length;i+=512){const r=await dev.transferOut(pick.ep,b.slice(i,i+512));if(r.status!=='ok')throw new Error('Printer tidak merespons (status '+r.status+').');await posSleep(8);}},
  close:async()=>{try{await dev.releaseInterface(pick.itf);}catch(e){}try{await dev.close();}catch(e){}}};
 posPrinterLabel();}
async function posConnectUSB(){if(!navigator.usb){alert('Browser ini tidak mendukung WebUSB. Gunakan Chrome atau Edge di PC (alamat harus https).');return;}
 let dev;try{dev=await navigator.usb.requestDevice({filters:[]});}catch(e){if(e.name!=='NotFoundError')alert('Gagal memilih perangkat: '+e.message);return;}
 try{if(POS.printer)await posDisconnect(true);await posUsbUse(dev);}
 catch(e){try{await dev.close();}catch(x){}
  const busy=/claim|access|denied|busy|SecurityError|NetworkError|open/i.test(e.name+' '+e.message);
  alert('Gagal terhubung ke printer USB: '+e.message+(busy?'\n\nPenyebab umum di Windows: driver POS-58 masih memegang printer. Ganti driver ke WinUSB memakai Zadig (langkahnya ada di jendela Printer), lalu cabut-colok kabel dan coba lagi.':''));
  return posPrinterModal();}
 posPrinterModal();}
async function posAutoUSB(){try{if(!navigator.usb||POS.printer)return;const ds=await navigator.usb.getDevices();for(const d of ds){try{await posUsbUse(d);return;}catch(e){try{await d.close();}catch(x){}}}}catch(e){}}
async function posAutoSerial(){try{if(!navigator.serial||POS.printer)return;const ps=await navigator.serial.getPorts();if(ps.length)await posSerialUse(ps[0]);}catch(e){}}
async function posConnectBT(){if(!navigator.bluetooth){alert('Browser ini tidak mendukung Web Bluetooth. Gunakan Chrome/Edge (Android atau PC).');return;}
 try{const dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:POS_BT_SERVICES});
  const srv=await dev.gatt.connect();let ch=null;
  for(const sv of await srv.getPrimaryServices()){for(const c of await sv.getCharacteristics()){if(c.properties.write||c.properties.writeWithoutResponse){ch=c;break;}}if(ch)break;}
  if(!ch)throw new Error('Karakteristik tulis printer tidak ditemukan. Printer ini mungkin Bluetooth klasik: pasangkan di Windows lalu pakai tombol PC Windows.');
  let size=100;
  POS.printer={type:'Bluetooth BLE',name:dev.name||'Printer BT',dev,
   write:async b=>{for(let i=0;i<b.length;){const p=b.slice(i,i+size);
     try{if(ch.properties.writeWithoutResponse)await ch.writeValueWithoutResponse(p);else await ch.writeValue(p);}
     catch(e){if(size>20){size=20;continue;}throw e;}
     i+=p.length;await posSleep(size>20?25:35);}},
   close:async()=>{try{dev.gatt.disconnect();}catch(e){}}};
  dev.addEventListener('gattserverdisconnected',()=>{POS.printer=null;posPrinterLabel();});
  posPrinterLabel();
 }catch(e){if(e.name!=='NotFoundError')alert('Gagal menghubungkan: '+e.message);return;}posPrinterModal();}
async function posDisconnect(silent){const p=POS.printer;POS.printer=null;try{if(p&&p.close)await p.close();}catch(e){}posPrinterLabel();if(!silent)posPrinterModal();}
async function posTestPrint(){if(!POS.printer){alert('Printer belum terhubung. Hubungkan dulu lewat tombol di atas.');return;}

async function posSendRemote(sale){
 sale=sale||POS.cur||POS.last;if(!sale){alert('Belum ada struk.');return;}
 if(!finClient){alert('Koneksi database tidak tersedia.');return;}
 const r=await finClient.from('print_jobs').insert([{account:POS.s.account,payload:posSalePayload(sale),requested_by:posWho()}]).select();
 if(r.error||!r.data||!r.data.length){alert('Gagal mengirim ke printer kasir: '+(r.error?r.error.message:'database tidak merespons')+'\n\nPastikan migrasi_print_jobs.sql sudah dijalankan di Supabase Bendahara.');return;}
 const id=r.data[0].id;showToast((sale.kind==='diag'?'Diagnosa':'Struk')+' dikirim ke PC printer...','info');posQueueLoad();
 setTimeout(async()=>{try{const c=await finClient.from('print_jobs').select('status,error').eq('id',id).single();const st=c.data&&c.data.status;
  if(st==='done')showToast((sale.kind==='diag'?'Diagnosa':'Struk')+' berhasil dicetak.','success');
  else if(st==='error')alert('Printer kasir gagal mencetak: '+c.data.error);
  else showToast('PC printer belum merespons. Struk tetap tersimpan di antrian Kasir dan akan dicetak begitu PC printer siap.','error');
  posQueueLoad();}catch(e){}},8000);}
async function posStationRun(){
 if(POS.s.station===false||!finClient||POS.st.busy||!POS.printer)return;POS.st.busy=true;
 try{
  const since=new Date(Date.now()-10*6e4).toISOString();
  const q=await finClient.from('print_jobs').select('*').eq('status','pending').eq('account',POS.s.account).gte('created_at',since).order('id');
  for(const j of (q.data||[])){
   if(!POS.printer)break;
   const c=await finClient.from('print_jobs').update({status:'printing',station:(POS.s.cashier||'')+' ('+posDevice()+' stasiun)'}).eq('id',j.id).eq('status','pending').select();
   if(!c.data||!c.data.length)continue; // sudah diambil stasiun lain
   try{const sale={...j.payload,at:new Date(j.payload.at)};
    await POS.printer.write(await posBytes(posReceipt(sale),sale));
    await finClient.from('print_jobs').update({status:'done',printed_at:new Date().toISOString()}).eq('id',j.id);
    showToast((j.payload&&j.payload.kind==='diag'?'Diagnosa':'Struk')+' dari '+(j.requested_by||'perangkat lain')+' dicetak.','success');
   }catch(e){await finClient.from('print_jobs').update({status:'error',error:String(e.message).slice(0,200)}).eq('id',j.id);}
  }
 }catch(e){console.error(e);}
 POS.st.busy=false;posQueueLoad();}
function posStationStop(){try{if(POS.st.ch){finClient.removeChannel(POS.st.ch);POS.st.ch=null;}}catch(e){}clearInterval(POS.st.timer);POS.st.timer=null;try{if(POS.st.wl){POS.st.wl.release();POS.st.wl=null;}}catch(e){}}
function posStationStart(){posStationStop();if(POS.s.station===false||!POS.printer||!finClient)return;
 POS.st.ch=finClient.channel('print_jobs_rt').on('postgres_changes',{event:'INSERT',schema:'public',table:'print_jobs'},()=>posStationRun()).subscribe();
 POS.st.timer=setInterval(posStationRun,5000);
 posWakeLock();
 posStationRun();}
function posWakeLock(){try{if(navigator.wakeLock&&!POS.st.wl)navigator.wakeLock.request('screen').then(w=>{POS.st.wl=w;w.addEventListener('release',()=>{POS.st.wl=null;});}).catch(()=>{});}catch(e){}}
// Stasiun otomatis aktif selama ada printer terhubung (dan tidak dimatikan manual)
function posStationSync(){const on=!!POS.printer&&POS.s.station!==false&&!!finClient;
 if(on&&!POS.st.timer)posStationStart();else if(!on&&POS.st.timer)posStationStop();}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(POS.st.timer){posWakeLock();posStationRun();}if(appData.activeTab==='kasir')posQueueLoad();}});
function posToggle(k){POS.s[k]=!(POS.s[k]!==false);posSave();posStationSync();posPrinterModal();}

POS.pj={rows:[],err:'',loaded:false,busy:false};
async function posQueueLoad(){if(!finClient||POS.pj.busy)return;POS.pj.busy=true;
 try{const since=new Date(Date.now()-3*864e5).toISOString();
  let q=finClient.from('print_jobs').select('*').gte('created_at',since).order('id',{ascending:false}).limit(30);
  if(POS.s.account)q=q.eq('account',POS.s.account);
  const r=await q;if(r.error){POS.pj.err=r.error.message;POS.pj.rows=[];}else{POS.pj.err='';POS.pj.rows=r.data||[];}}
 catch(e){POS.pj.err=e.message;}
 POS.pj.busy=false;POS.pj.loaded=true;posQueueRender();}
function posJobSale(j){const p=j.payload||{};return {...p,at:new Date(p.at||j.created_at)};}
function posJobStatus(j){const age=Date.now()-new Date(j.created_at).getTime();
 if(j.status==='pending')return age>10*6e4?['Kedaluwarsa','bg-slate-200 text-slate-600']:['Menunggu printer','bg-amber-100 text-amber-700'];
 if(j.status==='printing')return ['Sedang dicetak','bg-blue-100 text-blue-700'];
 if(j.status==='done')return ['Tercetak','bg-emerald-100 text-emerald-700'];
 if(j.status==='error')return ['Gagal','bg-rose-100 text-rose-700'];
 return [j.status||'-','bg-slate-100 text-slate-600'];}
function posQueueRender(){const h=$p('posQueue');if(!h)return;const P=POS.pj,p2=x=>String(x).padStart(2,'0');
 const wait=P.rows.filter(j=>j.status==='pending'&&Date.now()-new Date(j.created_at).getTime()<=10*6e4).length;

 :!P.rows.length?`<div class="p-6 text-center text-xs text-slate-400">${P.loaded?'Belum ada struk di antrian. Setiap struk yang dicetak dari perangkat manapun akan tersimpan di sini.':'Memuat...'}</div>`
 :`<div class="divide-y divide-slate-100">`+P.rows.map(j=>{const sl=posJobSale(j),st=posJobStatus(j),d=new Date(j.created_at),no=sl.id?posReceiptNo(sl):'Cetak Uji',can=j.status!=='printing';
  return `<div class="flex flex-wrap items-center gap-x-3 gap-y-1.5 px-3 py-2.5 text-xs">
   <div class="min-w-[120px]"><div class="font-mono font-bold text-[#003b87]">${pe(no)}${sl.reprint?' <span class="text-[9px] text-amber-600">SALINAN</span>':''}</div><div class="text-[10px] text-slate-400">${p2(d.getDate())}/${p2(d.getMonth()+1)} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}</div></div>
   <div class="flex-1 min-w-[140px] text-slate-600"><div class="truncate">${pe((sl.items||[]).slice(0,2).map(i=>i.name).join(', '))}${(sl.items||[]).length>2?' +'+((sl.items||[]).length-2):''}</div><div class="text-[10px] text-slate-400">Dari: ${pe(j.requested_by||'-')}${j.station?' &bull; Dicetak: '+pe(j.station):''}</div>${j.status==='error'&&j.error?`<div class="text-[10px] text-rose-500">${pe(j.error)}</div>`:''}</div>
   <div class="font-mono font-bold">${sl.kind==='diag'?'<span class="px-1.5 py-0.5 rounded bg-amber-100 text-amber-700 text-[10px] font-bold">DIAGNOSA</span>':posRp(sl.total)}</div>
   <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${st[1]}">${st[0]}</span>
   <div class="flex gap-1"><button onclick="posQueueView(${j.id})" class="${BTN}bg-slate-100 text-slate-700 hover:bg-slate-200" title="Lihat struk"><i class="fa-solid fa-eye"></i></button>
   <button ${can?'':'disabled'} onclick="posQueuePrint(${j.id})" class="${BTN}bg-emerald-600 text-white hover:bg-emerald-700 disabled:opacity-40" title="Cetak langsung"><i class="fa-solid fa-plug"></i> Cetak</button>
   <button onclick="posQueueDel([${j.id}])" class="${BTN}bg-rose-50 text-rose-600 hover:bg-rose-600 hover:text-white" title="Hapus dari antrian"><i class="fa-solid fa-trash"></i></button></div></div>`;}).join('')+`</div>`;
 h.innerHTML=`<div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
  <div class="flex flex-wrap items-center justify-between gap-2 px-4 py-3 bg-slate-50 border-b border-slate-200">
   <div><div class="text-sm font-extrabold text-slate-800"><i class="fa-solid fa-print text-[#003b87] mr-1"></i> Struk Siap Cetak <span class="text-[10px] font-semibold text-slate-400">(tersinkron di semua perangkat)</span></div>
   <div class="text-[11px] font-semibold ${POS.printer?'text-emerald-600':'text-slate-500'}">${POS.printer?(POS.s.station!==false?'Perangkat ini = Stasiun Cetak: otomatis mencetak struk dari perangkat lain.':'Printer terhubung, tetapi penerimaan dari perangkat lain dimatikan.'):'Perangkat ini tanpa printer: Cetak Langsung dikirim ke PC printer.'}${wait?` &bull; <span class="text-amber-600">${wait} menunggu</span>`:''}</div></div>
   <div class="flex gap-1.5"><button onclick="posQueueLoad()" class="${BTN}bg-white border border-slate-200 text-slate-600"><i class="fa-solid fa-rotate"></i> Segarkan</button>
   ${done?`<button onclick="posQueueClearDone()" class="${BTN}bg-white border border-slate-200 text-slate-600"><i class="fa-solid fa-broom"></i> Hapus yang tercetak</button>`:''}</div></div>
  <div class="max-h-[42vh] overflow-y-auto">${body}</div></div>`;}
function posQueueView(id){const j=POS.pj.rows.find(x=>x.id===id);if(!j)return;const sl=posJobSale(j);if(!sl.items){alert('Data struk kosong.');return;}posLast(false,sl);}

 t.innerHTML=`<table class="w-full text-xs min-w-[860px]"><thead class="bg-slate-50 text-slate-500 uppercase text-[10px]"><tr><th class="p-3 w-8"><input type="checkbox" ${all?'checked':''} onchange="posHistSelAll(this.checked)" class="w-4 h-4"></th><th class="p-3 text-left">No. Struk</th><th class="p-3 text-left">Waktu</th><th class="p-3 text-left">Isi transaksi</th><th class="p-3 text-left">Kasir / Penerima</th><th class="p-3 text-center">Bayar</th><th class="p-3 text-right">Total</th><th class="p-3 text-center">Aksi</th></tr></thead><tbody>`+

function posDeleteAsk(ids){const rows=ids.map(i=>POS.hist.rows.find(x=>x.id===i)).filter(Boolean);if(!rows.length)return;
 const tot=rows.reduce((a,s)=>a+s.total,0);
 posModal(`<div class="flex justify-between items-center"><h3 class="font-extrabold text-rose-600"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Hapus ${rows.length} Transaksi?</h3><button onclick="posClose()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button></div>

async function posDeleteDo(ids){const b=$p('dlGo');if(b){b.disabled=true;b.innerText='Menghapus...';}
 let ok=0;const errs=[];
 for(const id of ids){const s=POS.hist.rows.find(x=>x.id===id);if(!s)continue;const no=posReceiptNo(s);
  try{const d=await finClient.from('pos_sales').delete().eq('id',id).select();
   if(d.error||!d.data||!d.data.length){errs.push(no+': '+(d.error?d.error.message:'database menolak penghapusan'));continue;}
   if(s.tx){const m=await finClient.from('inventory_moves').delete().eq('transaction_id',s.tx),t=await finClient.from('transactions').delete().eq('id',s.tx);
    if(m.error||t.error)errs.push(no+': riwayat terhapus, tetapi data Bendahara gagal dibersihkan ('+(m.error||t.error).message+'). Hapus manual di Bendahara.');}
   const cts=[...new Set((s.items||[]).map(i=>i&&i.costTx).filter(Boolean))];
   if(cts.length){const ct=await finClient.from('transactions').delete().in('id',cts);if(ct.error)errs.push(no+': pengeluaran beban pokok gagal dihapus ('+ct.error.message+'). Hapus manual di Bendahara.');}
   ok++;POS.hist.sel.delete(id);}catch(e){errs.push(no+': '+e.message);}}
 posClose();await posLoad();await posHistLoad();
 alert(ok+' transaksi dihapus.'+(errs.length?'\n\nBermasalah:\n'+errs.join('\n'):''));}

async function posFinTx(row){const r=await posInsTx(row);if(r.error||!r.data||!r.data.length)throw new Error(r.error?r.error.message:'database tidak merespons');return r.data[0].id;}

 try{tx=await posFinTx({account:a,type:'out',date:d,description:'Beli stok: '+name,qty,category:'Belanja Stok',cash_type:kas,amount:cost,recipient:aud});

async function posStokSave(mode,id){const g=i=>$p(i)?$p(i).value:'',a=POS.s.account;
 const aud=g('sfAuditor').trim();if(!aud){alert('Nama auditor wajib diisi.');const ea=$p('sfAuditor');if(ea)ea.focus();return;}
 try{
  if(mode==='new'||mode==='edit'){const name=g('sfName').trim();if(!name){alert('Nama wajib diisi.');return;}
   const row={name,unit:g('sfUnit').trim()||'pcs',sell_price:parseFloat(g('sfPrice'))||0,barcode:g('sfBar').trim()||null};
   if(mode==='edit'){let r=await finClient.from('inventory_items').update({...row,editor:aud}).eq('id',id);
    if(r.error&&/editor/i.test(r.error.message||''))r=await finClient.from('inventory_items').update(row).eq('id',id);
    if(r.error)throw new Error(r.error.message);}
   else{if(POS.items.some(i=>i.account===a&&i.name.toLowerCase()===name.toLowerCase())){alert('Nama barang sudah ada.');return;}
    let r=await finClient.from('inventory_items').insert([{...row,account:a,editor:aud}]).select();
    if(r.error&&/editor/i.test(r.error.message||''))r=await finClient.from('inventory_items').insert([{...row,account:a}]).select();
    if(r.error||!r.data||!r.data.length)throw new Error(r.error?r.error.message:'database tidak merespons');
    const q=parseFloat(g('sfQty'))||0,c=parseFloat(g('sfCost'))||0;if(q>0){if(!(c>0)){alert('Isi harga beli untuk stok awal.');return;}await posBuy(r.data[0].id,name,q,c,g('sfKas'),aud);}}}
  if(mode==='buy'){const q=parseFloat(g('sfQty')),c=parseFloat(g('sfCost')),it=POS.items.find(i=>i.id===id);if(!(q>0)||!(c>0)){alert('Isi jumlah dan harga beli.');return;}await posBuy(id,it.name,q,c,g('sfKas'),aud);}
  if(mode==='adj'){const q=parseFloat(g('sfQty')),n=g('sfNote').trim();if(!q||!n){alert('Isi selisih jumlah dan catatan.');return;}
   const st=(posWalk()[id]||{qty:0}).qty;if(q<0&&-q>st+1e-9){alert('Stok tidak cukup (sisa '+(+st.toFixed(2))+').');return;}
   await posFinMove({account:a,item_id:id,date:posToday(),type:'adj',qty:q,unit_cost:0,unit_price:0,note:n+' [Auditor: '+aud+']'});}
 }catch(e){alert('Gagal menyimpan: '+e.message+(/barcode/i.test(e.message)?'\n\nJalankan migrasi_kasir.sql untuk menambah kolom barcode.':''));return;}
 posClose();await posLoad();}
