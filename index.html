        // ==========================================

        async function loadSupabaseData() {
            if (!supabaseClient) return;
            try {
                const { data: ordersData, error: ordErr } = await supabaseClient.from('orders').select('*');
                const { data: servicesData, error: svcErr } = await supabaseClient.from('services').select('*');

                if (!ordErr && ordersData && ordersData.length > 0) {
                    appData.orders = ordersData.map(o => ({
                        id: o.id, date: o.date, customerName: o.customer_name, room: o.room, phone: o.phone || '',
                        orderType: o.order_type, estimatedPrice: o.estimated_price, progress: o.progress, excelData: o.excel_data || []
                    }));
                }
                if (!svcErr && servicesData && servicesData.length > 0) {
                    appData.services = servicesData.map(s => ({
                        id: s.id, date: s.date, customerName: s.customer_name, room: s.room, phone: s.phone || '',
                        kelengkapan: s.kelengkapan || '', notes: s.notes, estimatedPrice: s.estimated_price, progress: s.progress, items: s.items || []
                    }));
                }
                renderApp();
            } catch (err) {
                console.error("Gagal sinkronisasi data Supabase:", err);
            }
        }

        function initRealtimeSubscription() {
            if (!supabaseClient) return;
            try {
                supabaseClient.channel('public-db-changes')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => loadSupabaseData())
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'services' }, () => loadSupabaseData())
                    .subscribe();
            } catch (e) {
                console.error("Realtime subscription error:", e);
            }
        }

        function formatRupiah(amount) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(amount || 0);
        }

        function generateUniqueId(prefix) {
            return `${prefix}-${Math.floor(1000 + Math.random() * 9000)}`;

        function getTodayDateString() {
            return new Date().toISOString().split('T')[0];

        function terbilang(nilai) {
            const angka = ["", "Satu", "Dua", "Tiga", "Empat", "Lima", "Enam", "Tujuh", "Delapan", "Sembilan", "Sepuluh", "Sebelas"];
            let temp = "";
            let n = Math.abs(nilai);

            if (n < 12) {
                temp = " " + angka[n];
            } else if (n < 20) {
                temp = terbilang(n - 10) + " Belas";
            } else if (n < 100) {
                temp = terbilang(Math.floor(n / 10)) + " Puluh" + terbilang(n % 10);
            } else if (n < 200) {
                temp = " Seratus" + terbilang(n - 100);
            } else if (n < 1000) {
                temp = terbilang(Math.floor(n / 100)) + " Ratus" + terbilang(n % 100);
            } else if (n < 2000) {
                temp = " Seribu" + terbilang(n - 1000);
            } else if (n < 1000000) {
                temp = terbilang(Math.floor(n / 1000)) + " Ribu" + terbilang(n % 1000);
            } else if (n < 1000000000) {
                temp = terbilang(Math.floor(n / 1000000)) + " Juta" + terbilang(n % 1000000);
            } else if (n < 1000000000000) {
                temp = terbilang(Math.floor(n / 1000000000)) + " Milyar" + terbilang(n % 1000000000);
            }
            return temp.trim() + " Rupiah";
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-blue-600';
            const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
            
            toast.className = `${bgClass} text-white px-4 py-3 rounded-2xl shadow-xl flex items-center gap-3 transition-all duration-300 transform translate-x-10 opacity-0 pointer-events-auto text-xs font-semibold`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-base"></i> <span>${message}</span>`;
            
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-x-10', 'opacity-0'));

            setTimeout(() => {
                toast.classList.add('translate-x-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function openModal(contentHtml) {
            const overlay = document.getElementById('modalOverlay');
            const container = document.getElementById('modalContainer');
            if (!overlay || !container) return;
            container.innerHTML = contentHtml;
            overlay.classList.remove('hidden');
            requestAnimationFrame(() => {
                overlay.classList.remove('opacity-0');
                container.classList.remove('scale-95', 'opacity-0');
                container.classList.add('scale-100', 'opacity-100');
            });
        }

        function closeModal() {
            const overlay = document.getElementById('modalOverlay');
            const container = document.getElementById('modalContainer');
            if (!overlay || !container) return;
            container.classList.remove('scale-100', 'opacity-100');
            container.classList.add('scale-95', 'opacity-0');
            overlay.classList.add('opacity-0');
            setTimeout(() => overlay.classList.add('hidden'), 300);
        }

        function filterInvoiceTables() {
            const kw = document.getElementById('searchInvoiceInput').value.toLowerCase();
            const filteredOrders = appData.orders.filter(o => o.id.toLowerCase().includes(kw) || o.customerName.toLowerCase().includes(kw) || o.room.toLowerCase().includes(kw));
            const filteredServices = appData.services.filter(s => s.id.toLowerCase().includes(kw) || s.customerName.toLowerCase().includes(kw) || s.room.toLowerCase().includes(kw));

            document.getElementById('orderInvoiceTableBody').innerHTML = renderOrderInvoiceRows(filteredOrders);
            document.getElementById('serviceInvoiceTableBody').innerHTML = renderServiceInvoiceRows(filteredServices);
            
            const countOrd = document.getElementById('countOrdInvoice');

            if (countSvc) countSvc.textContent = `${filteredServices.length} Transaksi`;

        function previewImageInput(e, previewId) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = document.getElementById(previewId);
                    if (img) {
                        img.src = evt.target.result;
                        img.classList.remove('hidden');
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        function saveTemplateForm(e, docType) {
            e.preventDefault();
            const noteVal = document.getElementById('tplNote').value;
            if (docType === 'invoice') documentTemplates.invoiceNote = noteVal;
            else documentTemplates.kwitansiNote = noteVal;

            documentTemplates.signerName = document.getElementById('tplSignerName').value;
            documentTemplates.signerTitle = document.getElementById('tplSignerTitle').value;

            const stampPreview = document.getElementById('previewStampImg');
            if (stampPreview && stampPreview.src) documentTemplates.stampImg = stampPreview.src;

            const sigPreview = document.getElementById('previewSignatureImg');
            if (sigPreview && sigPreview.src) documentTemplates.signatureImg = sigPreview.src;

            closeModal();
            showToast(`Template ${docType} berhasil diperbarui!`, 'success');
        }

        // ==========================================
        // GENERATE INVOICE & KWITANSI PDF

        function generateDocument(docType, sourceCategory, id) {
            let dataItem = null;
            if (sourceCategory === 'order') {
                dataItem = appData.orders.find(o => o.id === id);
            } else {
                dataItem = appData.services.find(s => s.id === id);
            }

            if (!dataItem) return;

            const isInvoice = docType === 'invoice';
            const isOrder = sourceCategory === 'order';

            let tableItemsHtml = '';
            let subtotal = dataItem.estimatedPrice || 0;

            if (isOrder) {
                if (dataItem.excelData && dataItem.excelData.length > 0) {
                    tableItemsHtml = dataItem.excelData.map((it, idx) => `
                        <tr style="border-bottom: 1px solid #e2e8f0;">
                            <td style="padding: 5px 8px; text-align: left; font-weight: bold;">${it.component}</td>
                            <td style="padding: 5px 8px; text-align: left; color: #475569;">${it.spec}</td>
                            <td style="padding: 5px 8px; text-align: center;">${it.qty}</td>
                            <td style="padding: 5px 8px; text-align: right; font-family: monospace;">${formatRupiah(it.price)}</td>
                            <td style="padding: 5px 8px; text-align: right; font-family: monospace; font-weight: bold;">${formatRupiah(it.qty * it.price)}</td>
                        </tr>
                    `).join('');
                } else {
                    tableItemsHtml = `
                        <tr style="border-bottom: 1px solid #e2e8f0;">
                            <td style="padding: 5px 8px; text-align: left; font-weight: bold;">${dataItem.orderType}</td>
                            <td style="padding: 5px 8px; text-align: left; color: #475569;">Paket Pemesanan ${dataItem.orderType}</td>
                            <td style="padding: 5px 8px; text-align: center;">1</td>
                            <td style="padding: 5px 8px; text-align: right; font-family: monospace;">${formatRupiah(subtotal)}</td>
                            <td style="padding: 5px 8px; text-align: right; font-family: monospace; font-weight: bold;">${formatRupiah(subtotal)}</td>
                        </tr>
                    `;
                }
            } else {
                if (dataItem.items && dataItem.items.length > 0) {
                    tableItemsHtml = dataItem.items.map((it, idx) => `
                        <tr style="border-bottom: 1px solid #e2e8f0;">
                            <td style="padding: 5px 8px; text-align: left; font-weight: bold;">${it.name}</td>
                            <td style="padding: 5px 8px; text-align: left; color: #475569;">Kendala: ${it.issue}</td>
                            <td style="padding: 5px 8px; text-align: center;">1</td>
                            <td style="padding: 5px 8px; text-align: right; font-family: monospace;">${formatRupiah(subtotal / dataItem.items.length)}</td>
                            <td style="padding: 5px 8px; text-align: right; font-family: monospace; font-weight: bold;">${formatRupiah(subtotal / dataItem.items.length)}</td>
                        </tr>
                    `).join('');
                } else {
                    tableItemsHtml = `
                        <tr style="border-bottom: 1px solid #e2e8f0;">
                            <td style="padding: 5px 8px; text-align: left; font-weight: bold;">Jasa Service</td>
                            <td style="padding: 5px 8px; text-align: left; color: #475569;">Perbaikan Unit Hardware / Software</td>
                            <td style="padding: 5px 8px; text-align: center;">1</td>
                            <td style="padding: 5px 8px; text-align: right; font-family: monospace;">${formatRupiah(subtotal)}</td>
                            <td style="padding: 5px 8px; text-align: right; font-family: monospace; font-weight: bold;">${formatRupiah(subtotal)}</td>
                        </tr>
                    `;
                }
            }

            const docContent = isInvoice ? renderInvoiceDocHtml(dataItem, tableItemsHtml, subtotal) : renderKwitansiDocHtml(dataItem, subtotal);

            openModal(`
                <div class="p-6 space-y-4 fade-in">
                    <div class="flex justify-between items-center border-b border-slate-100 pb-3 no-print">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid ${isInvoice ? 'fa-file-invoice text-blue-600' : 'fa-receipt text-emerald-600'} text-xl"></i>
                            <h3 class="font-bold text-slate-900 text-base">Pratinjau Dokumen (${isInvoice ? 'Invoice' : 'Kwitansi'})</h3>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="downloadDocumentPdf('${docType}_${dataItem.id}')" class="px-3.5 py-1.5 bg-[#0058c4] hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition-all shadow-md flex items-center gap-1.5">
                                <i class="fa-solid fa-download"></i> Download PDF A4
                            </button>
                            <button onclick="window.print()" class="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-xs font-bold transition-all shadow-md flex items-center gap-1.5">
                                <i class="fa-solid fa-print"></i> Cetak
                            </button>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg ml-2"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </div>

                    <!-- Dokumen Siap Cetak Ukuran A4 -->
                    <div class="bg-slate-100 p-4 rounded-2xl overflow-x-auto flex justify-center">
                        <div id="printablePaper" class="bg-white p-8 text-slate-800 text-[11px] shadow-lg border border-slate-200" style="width: 210mm; min-height: 297mm; box-sizing: border-box; color: #1e293b; display: flex; flex-direction: column; justify-content: space-between;">
                            ${docContent}
                        </div>
                    </div>
                </div>
            `);
        }

        function handleExcelPaste(e) {
            e.preventDefault();
            const clipboardData = (e.clipboardData || window.clipboardData).getData('text');
            if (!clipboardData) return;
            const rows = clipboardData.trim().split(/\r\n|\n|\r/);
            const parsedItems = [];
            let calculatedTotal = 0;

            rows.forEach(rowStr => {
                const cols = rowStr.split('\t');
                if (cols.length >= 2) {
                    const component = cols[0] ? cols[0].trim() : 'Komponen';
                    const spec = cols[1] ? cols[1].trim() : '-';
                    const qty = cols[2] && !isNaN(parseInt(cols[2])) ? parseInt(cols[2]) : 1;
                    let price = cols[3] ? parseInt(cols[3].replace(/[^0-9]/g, '')) || 0 : 0;
                    parsedItems.push({ component, spec, qty, price });
                    calculatedTotal += (qty * price);
                }
            });

            window.tempExcelParsed = parsedItems;
            renderExcelPreviewTable(parsedItems);
            if (calculatedTotal > 0) document.getElementById('ordPrice').value = calculatedTotal;
            showToast(`Berhasil mengonversi ${parsedItems.length} baris Excel!`, 'success');
        }

        function renderExcelPreviewTable(items) {
            const tbody = document.getElementById('excelPreviewBody');
            if (!tbody) return;
            if (items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-3 text-center text-slate-400 text-xs">Belum ada data tabel. Paste dari Excel di atas.</td></tr>`;
                return;
            }
            tbody.innerHTML = items.map(it => `
                <tr class="hover:bg-slate-50">
                    <td class="p-2 font-semibold text-slate-800">${it.component}</td>
                    <td class="p-2 text-slate-600">${it.spec}</td>
                    <td class="p-2 text-center">${it.qty}</td>
                    <td class="p-2 text-right">${formatRupiah(it.price)}</td>
                </tr>
            `).join('');
        }

                    `Barang antum sudah kami terima dengan rincian berikut :\n` +
                    `*- Kode Transaksi :* ${item.id}\n` +
                    `*- Nama Pelanggan :* ${item.customerName}\n` +
                    `*- Kamar :* ${item.room}\n` +
                    `*- Unit :* ${unitList}\n` +
                    `*- Keluhan :* ${item.notes || 'Perbaikan / Service perangkat'}\n` +
                    `*- Kelengkapan :* ${item.kelengkapan || 'Unit & aksesoris pendukung'}\n\n` +
                    `*- Status Terkini :* ${SERVICE_STAGES[item.progress].title}\n` +
                    `*- Estimasi Selesai :* ${item.date} (Biaya: ${formatRupiah(item.estimatedPrice)})\n\n` +
                    `Note : _Kami akan hubungi kembali jika pengerjaan selesai/belum atau jika ada konfirmasi pergantian komponen. Terima kasih!_🙏😊\n\n` +
                    `Wassalamualaikum👋\n\n` +
                    `📌 *Lacak progres service secara real-time melalui aplikasi dengan memasukkan kode transaksi di atas:*\n` +
                    `https://tracking-service-dcc.vercel.app/`;
            }

            // Format nomor HP ke standar internasional (ubah 08... jadi 628...)
            let formattedPhone = customerPhone.replace(/[^0-9]/g, '');
            if (formattedPhone.startsWith('0')) {
                formattedPhone = '62' + formattedPhone.substring(1);
            }

            const waUrl = formattedPhone ? `https://wa.me/${formattedPhone}?text=${encodeURIComponent(messageText)}` : `https://wa.me/?text=${encodeURIComponent(messageText)}`;

            openModal(`
                <div class="p-6 sm:p-8 space-y-5 fade-in">
                    <div class="flex justify-between items-center border-b border-slate-100 pb-4">
                        <div class="flex items-center gap-2">
                            <i class="fa-brands fa-whatsapp text-emerald-600 text-xl"></i>
                            <h3 class="font-bold text-slate-900 text-base">Pratinjau & Salin Pesan WA ${customerPhone ? `(Tujuan: ${customerPhone})` : ''}</h3>
                        </div>
                        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div class="space-y-2">
                        <textarea id="chatTextarea" readonly class="w-full h-56 p-3.5 text-xs font-mono bg-slate-50 border border-slate-200 rounded-2xl outline-none text-slate-800 leading-relaxed">${messageText}</textarea>
                    </div>
                    <div class="flex gap-3 pt-2">
                        <button onclick="copyChatMessage()" class="flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow-md transition-all duration-300 hover:scale-105 flex items-center justify-center gap-2">
                            <i class="fa-regular fa-copy"></i> Salin Teks Chat
                        </button>
                        <button onclick="window.open('${waUrl}', '_blank')" class="py-3 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-md transition-all duration-300 hover:scale-105 flex items-center justify-center gap-2">
                            <i class="fa-brands fa-whatsapp"></i> Buka WA Langsung
                        </button>
                    </div>
                </div>
            `);
        }

        function copyChatMessage() {
            const textarea = document.getElementById('chatTextarea');
            if (textarea) {
                textarea.select();
                navigator.clipboard.writeText(textarea.value);
                showToast('Teks pesan berhasil disalin ke clipboard!', 'success');
            }
        }

        // ==========================================
        // RIWAYAT & REKAPAN TABS
        // ==========================================
        function renderTabRiwayat() {
            return `
                <div class="space-y-6 fade-in">
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                            <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Cari Nama / Kode / Kamar</label>
                            <input type="text" id="filterRiwayatSearch" onkeyup="applyRiwayatFilter()" placeholder="Ketik kata kunci..." class="w-full px-3 py-1.5 text-xs rounded-xl border border-slate-200 outline-none">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Filter Dari Tanggal</label>
                            <input type="date" id="filterRiwayatDateFrom" onchange="applyRiwayatFilter()" class="w-full px-3 py-1.5 text-xs rounded-xl border border-slate-200 outline-none text-slate-600">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Sampai Tanggal</label>
                            <input type="date" id="filterRiwayatDateTo" onchange="applyRiwayatFilter()" class="w-full px-3 py-1.5 text-xs rounded-xl border border-slate-200 outline-none text-slate-600">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 space-y-4">
                            <h3 class="font-bold text-slate-800 text-xs pb-3 border-b border-slate-100 flex items-center justify-between">
                                <span class="flex items-center gap-2"><i class="fa-solid fa-wrench text-amber-500"></i> Riwayat Service</span>
                                <span id="countSvcRiwayat" class="text-xs font-bold bg-amber-50 text-amber-800 px-2.5 py-0.5 rounded-full font-mono">0</span>
                            </h3>
                            <div id="riwayatServiceList" class="space-y-3 max-h-[60vh] overflow-y-auto pr-1"></div>
                        </div>
                        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 space-y-4">
                            <h3 class="font-bold text-slate-800 text-xs pb-3 border-b border-slate-100 flex items-center justify-between">
                                <span class="flex items-center gap-2"><i class="fa-solid fa-cart-shopping text-blue-600"></i> Riwayat Pemesanan</span>
                                <span id="countOrdRiwayat" class="text-xs font-bold bg-blue-50 text-blue-800 px-2.5 py-0.5 rounded-full font-mono">0</span>
                            </h3>
                            <div id="riwayatOrderList" class="space-y-3 max-h-[60vh] overflow-y-auto pr-1"></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function applyRiwayatFilter() {
            const keyword = document.getElementById('filterRiwayatSearch')?.value.toLowerCase() || '';
            const dateFrom = document.getElementById('filterRiwayatDateFrom')?.value || '';
            const dateTo = document.getElementById('filterRiwayatDateTo')?.value || '';

            const filterFn = (item) => {
                const matchKw = item.id.toLowerCase().includes(keyword) || item.customerName.toLowerCase().includes(keyword) || item.room.toLowerCase().includes(keyword);
                let matchDate = true;
                if (dateFrom && item.date < dateFrom) matchDate = false;
                if (dateTo && item.date > dateTo) matchDate = false;
                return matchKw && matchDate;
            };

            const filteredServices = appData.services.filter(filterFn);
            const filteredOrders = appData.orders.filter(filterFn);

            const countSvcEl = document.getElementById('countSvcRiwayat');
            if (countSvcEl) countSvcEl.textContent = filteredServices.length;

            const countOrdEl = document.getElementById('countOrdRiwayat');
            if (countOrdEl) countOrdEl.textContent = filteredOrders.length;

            const svcContainer = document.getElementById('riwayatServiceList');
            if (svcContainer) {
                svcContainer.innerHTML = filteredServices.length ? filteredServices.map(s => `
                    <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs flex justify-between items-center">
                        <div>
                            <span class="font-mono font-bold text-amber-600">${s.id}</span>
                            <p class="font-bold text-slate-800 mt-0.5">${s.customerName} (${s.room})</p>
                        </div>
                        <div class="text-right">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-100 text-amber-800">${SERVICE_STAGES[s.progress].title}</span>
                            <p class="font-mono font-bold text-slate-700 mt-1">${formatRupiah(s.estimatedPrice)}</p>
                        </div>
                    </div>
                `).join('') : `<p class="text-center text-xs text-slate-400 py-6">Tidak ada riwayat.</p>`;
            }

            const ordContainer = document.getElementById('riwayatOrderList');
            if (ordContainer) {
                ordContainer.innerHTML = filteredOrders.length ? filteredOrders.map(o => `
                    <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs flex justify-between items-center">
                        <div>
                            <span class="font-mono font-bold text-blue-700">${o.id}</span>
                            <p class="font-bold text-slate-800 mt-0.5">${o.customerName} (${o.room})</p>
                        </div>
                        <div class="text-right">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-blue-100 text-blue-800">${ORDER_STAGES[o.progress].title}</span>
                            <p class="font-mono font-bold text-slate-700 mt-1">${formatRupiah(o.estimatedPrice)}</p>
                        </div>
                    </div>
                `).join('') : `<p class="text-center text-xs text-slate-400 py-6">Tidak ada riwayat.</p>`;
            }
        }

        function renderTabRekapan() {
            const totalSvcIncome = appData.services.reduce((a, b) => a + (b.estimatedPrice || 0), 0);
            const totalOrdIncome = appData.orders.reduce((a, b) => a + (b.estimatedPrice || 0), 0);

            return `
                <div class="space-y-6 fade-in">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="bg-amber-500 text-white p-6 rounded-2xl shadow-md">
                            <span class="text-xs uppercase font-bold text-amber-100 tracking-wider">Rekapan Uang Service</span>
                            <h2 class="text-2xl sm:text-3xl font-extrabold font-mono mt-1">${formatRupiah(totalSvcIncome)}</h2>
                        </div>
                        <div class="bg-[#0058c4] text-white p-6 rounded-2xl shadow-md">
                            <span class="text-xs uppercase font-bold text-blue-100 tracking-wider">Rekapan Uang Pemesanan</span>
                            <h2 class="text-2xl sm:text-3xl font-extrabold font-mono mt-1">${formatRupiah(totalOrdIncome)}</h2>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                            <h3 class="font-bold text-slate-800 text-xs flex items-center gap-2"><i class="fa-solid fa-chart-line text-amber-500"></i> Diagram Peningkatan Uang Service</h3>
                            <div class="h-64 relative"><canvas id="chartServiceIncome"></canvas></div>
                        </div>
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                            <h3 class="font-bold text-slate-800 text-xs flex items-center gap-2"><i class="fa-solid fa-chart-line text-blue-600"></i> Diagram Peningkatan Uang Pemesanan</h3>
                            <div class="h-64 relative"><canvas id="chartOrderIncome"></canvas></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function initRekapanCharts() {
            const serviceMap = {};
            appData.services.forEach(item => {
                const date = item.date || 'Lainnya';
                serviceMap[date] = (serviceMap[date] || 0) + (item.estimatedPrice || 0);
            });
            const svcDates = Object.keys(serviceMap).sort();
            const svcTotals = svcDates.map(date => serviceMap[date]);

            const orderMap = {};
            appData.orders.forEach(item => {
                const date = item.date || 'Lainnya';
                orderMap[date] = (orderMap[date] || 0) + (item.estimatedPrice || 0);
            });
            const ordDates = Object.keys(orderMap).sort();
            const ordTotals = ordDates.map(date => orderMap[date]);

            const ctxSvc = document.getElementById('chartServiceIncome');
            if (ctxSvc) {
                new Chart(ctxSvc, {
                    type: 'line',
                    data: {
                        labels: svcDates.length ? svcDates : ['Belum ada data'],
                        datasets: [{ 
                            label: 'Pemasukan Service (Rp)', 
                            data: svcTotals.length ? svcTotals : [0], 
                            borderColor: '#f59e0b', 
                            backgroundColor: 'rgba(245, 158, 11, 0.1)', 
                            fill: true, 
                            tension: 0.4 
                        }]
                    },
                    options: { 
                        responsive: true, 
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                ticks: {
                                    callback: function(value) {
                                        return 'Rp ' + value.toLocaleString('id-ID');
                                    }
                                }
                            }
                        }
                    }
                });
            }

            const ctxOrd = document.getElementById('chartOrderIncome');
            if (ctxOrd) {
                new Chart(ctxOrd, {
                    type: 'line',
                    data: {
                        labels: ordDates.length ? ordDates : ['Belum ada data'],
                        datasets: [{ 
                            label: 'Pemasukan Pemesanan (Rp)', 
                            data: ordTotals.length ? ordTotals : [0], 
                            borderColor: '#0058c4', 
                            backgroundColor: 'rgba(0, 88, 196, 0.1)', 
                            fill: true, 
                            tension: 0.4 
                        }]
                    },
                    options: { 
                        responsive: true, 
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                ticks: {
                                    callback: function(value) {
                                        return 'Rp ' + value.toLocaleString('id-ID');
                                    }
                                }
                            }
                        }
                    }
                });
            }
        }

        // ==========================================
        // EVENTS ATTACHMENT
        // ==========================================
        function attachCustomerEvents() {
            const secretBtn = document.getElementById('secretAdminBtn');
            if (secretBtn) {
                secretBtn.addEventListener('click', () => {
                    openModal(`
                        <div class="p-8 space-y-6 text-center fade-in">
                            <img src="DCSC.png" alt="DCC Store" class="w-16 h-16 rounded-2xl bg-blue-50 p-2 mx-auto border border-blue-100 object-contain shadow-sm" onerror="this.style.display='none'">
                            <div>
                                <h3 class="font-extrabold text-slate-900 text-xl tracking-tight">DCC Store Admin</h3>
                                <p class="text-xs text-slate-400 mt-1">Masukkan Password Akses Keuangan Sektor</p>
                            </div>
                            <form id="adminLoginForm" class="space-y-4 text-left">
                                <div>
                                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">PASSWORD</label>
                                    <input type="password" id="adminPasswordInput" placeholder="Masukkan password" required class="w-full px-4 py-3 text-xs bg-slate-50 border border-slate-200 rounded-xl outline-none">
                                </div>
                                <button type="submit" class="w-full py-3 bg-[#0058c4] hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow-md transition-all">Masuk ke Sistem</button>
                            </form>
                        </div>
                    `);

                    document.getElementById('adminLoginForm').addEventListener('submit', (e) => {
                        e.preventDefault();
                        if (document.getElementById('adminPasswordInput').value === 'staffdcc2.2') {
                            appData.currentRole = 'admin';
                            closeModal();
                            renderApp();
                            showToast('Selamat datang, Admin DCC Store!', 'success');
                        } else {
                            showToast('Kata sandi salah!', 'error');
                        }
                    });
                });
            }

            const lookupForm = document.getElementById('customerLookupForm');
            if (lookupForm) {
                lookupForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const code = document.getElementById('customerCodeInput').value.trim().toUpperCase();
                    let found = appData.orders.find(o => o.id.toUpperCase() === code) || appData.services.find(s => s.id.toUpperCase() === code);
                    if (found) {
                        appData.customerActiveRecord = found;
                        renderApp();
                    } else {
                        showToast('Kode Transaksi Tidak Ditemukan.', 'error');
                    }
                });
            }

            const resetBtn = document.getElementById('resetSearchBtn');
            if (resetBtn) {
                resetBtn.addEventListener('click', () => {
                    appData.customerActiveRecord = null;
                    renderApp();
                });
            }
        }

        function attachAdminEvents() {
            const logoutBtn = document.getElementById('adminLogoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    appData.currentRole = 'customer';
                    appData.customerActiveRecord = null;
                    renderApp();
                    showToast('Berhasil keluar dari Admin.', 'info');
                });
            }
            if (appData.activeTab === 'riwayat') {
                setTimeout(applyRiwayatFilter, 50);
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            renderApp();
            if (supabaseClient) {
                await loadSupabaseData();
                initRealtimeSubscription();
            }
        });
    </script>
</body>
</html>
