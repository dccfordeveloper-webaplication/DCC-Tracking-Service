<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC Center - Service & Ordering System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Chart.js for Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dcc: {
                            bg: '#004aa6',
                            header: '#003b87',
                            card: '#0058c4',
                            accent: '#ff6b00',
                            accentHover: '#e66000',
                            lightBg: '#f0f5fd'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #00459c;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .main-card-shadow {
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }
        .step-active {
            box-shadow: 0 0 15px rgba(255, 107, 0, 0.6);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="text-slate-800 font-sans min-h-screen flex flex-col antialiased selection:bg-dcc-accent selection:text-white">

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

    <!-- MAIN APP CONTAINER -->
    <div id="app" class="flex-grow flex flex-col min-h-screen">
        <!-- Content dynamic injection point -->
    </div>

    <!-- MODAL DIALOG CONTAINER -->
    <div id="modalOverlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-40 hidden flex items-center justify-center p-4">
        <div id="modalContainer" class="bg-white rounded-[28px] shadow-2xl max-w-xl w-full max-h-[90vh] overflow-y-auto transform transition-all duration-300 scale-95 opacity-0">
            <!-- Dynamic Modal Content -->
        </div>
    </div>

    <script>
        // ==========================================
        // INITIAL STATE & SEED DATA STORAGE
        // ==========================================
        const DEFAULT_ORDERS = [
            {
                id: 'ORD-7821',
                date: '2026-10-25',
                customerName: 'Ahmad Fauzi',
                room: 'Lab Komputer 2 / Gedung B',
                orderType: 'PC Rendering High-End',
                estimatedPrice: 18500000,
                progress: 2, // 0: Rancangan, 1: Anggaran, 2: Pemesanan Ritel, 3: Pengiriman, 4: Selesai
                excelData: [
                    { component: 'Processor', spec: 'Intel Core i7-13700K', qty: 1, price: 6200000 },
                    { component: 'Motherboard', spec: 'ASUS ROG Strix Z790-F', qty: 1, price: 4800000 },
                    { component: 'RAM', spec: 'Corsair Vengeance DDR5 32GB (2x16GB)', qty: 1, price: 2100000 },
                    { component: 'VGA', spec: 'NVIDIA RTX 4070 12GB', qty: 1, price: 9500000 },
                    { component: 'Storage', spec: 'SSD NVMe Samsung 980 Pro 1TB', qty: 1, price: 1600000 }
                ]
            },
            {
                id: 'ORD-3094',
                date: '2026-10-27',
                customerName: 'Siti Rahmawati',
                room: 'Ruang Dosen 104',
                orderType: 'Set PC Admin Office + Monitor 24"',
                estimatedPrice: 7200000,
                progress: 0,
                excelData: [
                    { component: 'Processor', spec: 'Intel Core i3-12100', qty: 1, price: 1600000 },
                    { component: 'RAM', spec: 'Kingston 8GB DDR4', qty: 1, price: 350000 },
                    { component: 'Storage', spec: 'SSD 512GB NVMe', qty: 1, price: 550000 },
                    { component: 'Monitor', spec: 'LG 24 Inch IPS FHD', qty: 1, price: 1500000 }
                ]
            }
        ];

        const DEFAULT_SERVICES = [
            {
                id: 'SVC-4102',
                date: '2026-10-26',
                customerName: 'Budi Santoso',
                room: 'Keuangan / Lt. 2',
                notes: 'Mohon dibantu instal ulang software akuntansi jika selesai.',
                estimatedPrice: 350000,
                progress: 1, // 0: Pengecekan, 1: Penanganan, 2: Lempar Teknisi Luar, 3: Selesai
                items: [
                    { name: 'Printer Epson L3110', issue: 'Hasil cetak garis-garis & paper jam' },
                    { name: 'PC Desktop Server', issue: 'Sering blue screen saat mati lampu' }
                ]
            },
            {
                id: 'SVC-8831',
                date: '2026-10-28',
                customerName: 'Dr. Hendra',
                room: 'Fakultas Teknik',
                notes: 'Butuh cepat untuk persentase ujian besok.',
                estimatedPrice: 150000,
                progress: 3,
                items: [
                    { name: 'Laptop Asus ROG Strix', issue: 'Overheating & kipas berbunyi bising' }
                ]
            }
        ];

        function getStorage(key, defaultVal) {
            const data = localStorage.getItem('dcc_' + key);
            return data ? JSON.parse(data) : defaultVal;
        }

        function setStorage(key, val) {
            localStorage.setItem('dcc_' + key, JSON.stringify(val));
        }

        let appData = {
            currentRole: 'customer', // 'customer' or 'admin'
            activeTab: 'beranda', // 'beranda', 'pemesanan', 'service', 'riwayat', 'rekapan'
            customerCodeInput: '',
            customerActiveRecord: null,
            orders: getStorage('orders', DEFAULT_ORDERS),
            services: getStorage('services', DEFAULT_SERVICES)
        };

        function saveData() {
            setStorage('orders', appData.orders);
            setStorage('services', appData.services);
        }

        const ORDER_STAGES = [
            { title: 'Proses Rancangan', icon: 'fa-file-signature', desc: 'Menyusun spesifikasi & perkiraan biaya' },
            { title: 'Pengajuan Anggaran', icon: 'fa-file-invoice-dollar', desc: 'Verifikasi & persetujuan pemesan' },
            { title: 'Pemesanan Ritel', icon: 'fa-shopping-cart', desc: 'Pembelian part dari supplier' },
            { title: 'Pengiriman', icon: 'fa-truck-fast', desc: 'Merakit & proses pengiriman unit' },
            { title: 'Selesai', icon: 'fa-circle-check', desc: 'Barang telah diterima & diuji' }
        ];

        const SERVICE_STAGES = [
            { title: 'Pengecekan', icon: 'fa-magnifying-glass', desc: 'Diagnosa awal kendala barang' },
            { title: 'Penanganan', icon: 'fa-screwdriver-wrench', desc: 'Proses perbaikan internal oleh tim' },
            { title: 'Lempar Teknisi Luar', icon: 'fa-user-gear', desc: 'Penanganan khusus pihak spesialis' },
            { title: 'Selesai', icon: 'fa-circle-check', desc: 'Barang siap diambil / diserahkan' }
        ];

        // ==========================================
        // UTILITY FUNCTIONS
        // ==========================================
        function formatRupiah(amount) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(amount || 0);
        }

        function generateUniqueId(prefix) {
            const rand = Math.floor(1000 + Math.random() * 9000);
            return `${prefix}-${rand}`;
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            const bgClass = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-blue-600';
            const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
            
            toast.className = `${bgClass} text-white px-4 py-3 rounded-2xl shadow-xl flex items-center gap-3 transition-all duration-300 transform translate-x-10 opacity-0 pointer-events-auto text-xs font-semibold`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-base"></i> <span>${message}</span>`;
            
            container.appendChild(toast);
            
            requestAnimationFrame(() => {
                toast.classList.remove('translate-x-10', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('translate-x-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function openModal(contentHtml) {
            const overlay = document.getElementById('modalOverlay');
            const container = document.getElementById('modalContainer');
            container.innerHTML = contentHtml;
            overlay.classList.remove('hidden');
            setTimeout(() => {
                container.classList.remove('scale-95', 'opacity-0');
                container.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            const overlay = document.getElementById('modalOverlay');
            const container = document.getElementById('modalContainer');
            container.classList.remove('scale-100', 'opacity-100');
            container.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 300);
        }

        // ==========================================
        // UI RENDER ENGINE
        // ==========================================
        function renderApp() {
            const app = document.getElementById('app');
            if (appData.currentRole === 'customer') {
                app.innerHTML = renderCustomerView();
                attachCustomerEvents();
            } else {
                app.innerHTML = renderAdminView();
                attachAdminEvents();
                if (appData.activeTab === 'rekapan') {
                    setTimeout(initRekapanCharts, 100);
                }
            }
        }

        // ------------------------------------------
        // CUSTOMER VIEW & PROGRESS TRACKER
        // ------------------------------------------
        function renderCustomerView() {
            const record = appData.customerActiveRecord;
            return `
                <div class="min-h-screen bg-[#00459c] text-white flex flex-col justify-between">
                    <!-- Top Bar Header -->
                    <header class="p-6 flex justify-between items-center max-w-5xl mx-auto w-full">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-white/10 border border-white/20 flex items-center justify-center text-white font-bold text-lg shadow-sm">
                                <i class="fa-solid fa-microchip"></i>
                            </div>
                            <div>
                                <h1 class="text-xl font-bold tracking-tight">Bendahara DCC</h1>
                                <p class="text-xs text-blue-200">Sistem Pelacakan Layanan & Service 2.0</p>
                            </div>
                        </div>
                        
                        <!-- Secret Admin Trigger Icon Button -->
                        <button id="secretAdminBtn" class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white transition-all cursor-pointer shadow-sm border border-white/20" title="Akses Admin Staff">
                            <i class="fa-solid fa-user-shield text-sm"></i>
                        </button>
                    </header>

                    <!-- Main Portal Area -->
                    <main class="flex-grow flex items-center justify-center p-4">
                        <div class="w-full max-w-2xl">
                            ${!record ? renderCustomerSearchCard() : renderCustomerProgressCard(record)}
                        </div>
                    </main>

                    <!-- Footer -->
                    <footer class="p-6 text-center text-xs text-blue-200/80">
                        Akses Khusus Pelanggan &bull; Realtime Cloud Sync
                    </footer>
                </div>
            `;
        }

        function renderCustomerSearchCard() {
            return `
                <div class="bg-white text-slate-800 p-8 sm:p-10 rounded-[28px] shadow-2xl text-center border border-white/20">
                    <div class="w-16 h-16 bg-blue-50 border border-blue-100 rounded-2xl flex items-center justify-center text-blue-600 text-2xl mx-auto mb-5 shadow-sm">
                        <i class="fa-solid fa-magnifying-glass-location"></i>
                    </div>
                    <h2 class="text-2xl font-bold mb-1 text-slate-900">Lacak Status Pesanan / Service</h2>
                    <p class="text-slate-500 text-xs mb-6 max-w-md mx-auto">Masukkan Kode Unik Transaksi (contoh: <span class="text-blue-600 font-mono font-bold">ORD-7821</span> atau <span class="text-blue-600 font-mono font-bold">SVC-4102</span>) untuk memantau pengerjaan.</p>

                    <form id="customerLookupForm" class="flex flex-col sm:flex-row gap-3 max-w-md mx-auto">
                        <input type="text" id="customerCodeInput" placeholder="Masukkan kode transaksi..." required uppercase 
                            class="flex-grow px-5 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-600 uppercase tracking-wider font-mono text-center sm:text-left text-sm font-semibold">
                        <button type="submit" class="px-6 py-3.5 bg-[#0058c4] hover:bg-blue-700 text-white font-bold rounded-2xl transition-all flex items-center justify-center gap-2 shadow-lg shadow-blue-600/30 text-sm">
                            <span>Lacak Status</span>
                            <i class="fa-solid fa-arrow-right text-xs"></i>
                        </button>
                    </form>

                    <div class="mt-8 pt-6 border-t border-slate-100 flex flex-wrap justify-center gap-6 text-[11px] text-slate-400 font-medium">
                        <span class="flex items-center gap-1.5"><i class="fa-solid fa-bolt text-amber-500"></i> Update Real-Time</span>
                        <span class="flex items-center gap-1.5"><i class="fa-solid fa-shield-halved text-blue-500"></i> Akses Transparan</span>
                    </div>
                </div>
            `;
        }

        function renderCustomerProgressCard(record) {
            const isOrder = record.id.startsWith('ORD');
            const stages = isOrder ? ORDER_STAGES : SERVICE_STAGES;
            const currentStep = record.progress;

            return `
                <div class="bg-white text-slate-800 rounded-[28px] shadow-2xl overflow-hidden border border-slate-100">
                    <!-- Top Banner -->
                    <div class="bg-[#003b87] text-white p-6 sm:p-8 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <span class="px-2.5 py-0.5 rounded-md bg-white/20 text-[10px] font-bold uppercase tracking-wider">${isOrder ? 'Pemesanan Komputer' : 'Layanan Service'}</span>
                                <span class="text-xs text-blue-200"><i class="fa-regular fa-clock mr-1"></i>${record.date}</span>
                            </div>
                            <h2 class="text-2xl font-extrabold tracking-tight font-mono">${record.id}</h2>
                            <p class="text-xs text-blue-200 font-medium mt-0.5">${record.customerName} &bull; ${record.room}</p>
                        </div>
                        <button id="resetSearchBtn" class="px-3.5 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-xs text-white border border-white/20 transition-all flex items-center gap-2 font-semibold">
                            <i class="fa-solid fa-arrow-left"></i> Cari Kode Lain
                        </button>
                    </div>

                    <!-- Visual Progress Stepper Bar -->
                    <div class="p-6 sm:p-8 border-b border-slate-100 bg-slate-50">
                        <h3 class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-6">Indikator Tahap Layanan</h3>
                        
                        <div class="relative flex justify-between items-center max-w-xl mx-auto">
                            <!-- Background Track Line -->
                            <div class="absolute left-0 top-1/2 transform -translate-y-1/2 w-full h-1.5 bg-slate-200 rounded-full z-0"></div>
                            
                            <!-- Active Progress Line -->
                            <div class="absolute left-0 top-1/2 transform -translate-y-1/2 h-1.5 bg-dcc-accent rounded-full z-0 transition-all duration-500"
                                style="width: ${(currentStep / (stages.length - 1)) * 100}%"></div>

                            <!-- Steps Icons -->
                            ${stages.map((stage, idx) => {
                                const isPassed = idx <= currentStep;
                                const isCurrent = idx === currentStep;
                                return `
                                    <div class="relative z-10 flex flex-col items-center">
                                        <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-full flex items-center justify-center font-bold text-xs sm:text-sm transition-all duration-300 ${
                                            isCurrent 
                                                ? 'bg-dcc-accent text-white ring-4 ring-orange-200 step-active scale-110' 
                                                : isPassed 
                                                    ? 'bg-dcc-accent text-white' 
                                                    : 'bg-white text-slate-400 border-2 border-slate-200'
                                        }">
                                            <i class="fa-solid ${stage.icon}"></i>
                                        </div>
                                        <div class="text-center mt-2 w-16 sm:w-20">
                                            <p class="text-[10px] font-bold ${isPassed ? 'text-slate-900' : 'text-slate-400'} line-clamp-1">${stage.title}</p>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <!-- Detail Section -->
                    <div class="p-6 sm:p-8 space-y-6">
                        <div class="bg-blue-50/70 border border-blue-100 p-4 rounded-2xl flex items-center gap-4">
                            <div class="w-10 h-10 rounded-xl bg-[#0058c4] text-white flex items-center justify-center text-lg flex-shrink-0 shadow-sm">
                                <i class="fa-solid ${stages[currentStep].icon}"></i>
                            </div>
                            <div>
                                <span class="text-xs font-bold text-blue-900 uppercase">Status Terkini: ${stages[currentStep].title}</span>
                                <p class="text-xs text-slate-600">${stages[currentStep].desc}</p>
                            </div>
                        </div>

                        ${isOrder ? renderCustomerOrderDetails(record) : renderCustomerServiceDetails(record)}
                    </div>
                </div>
            `;
        }

        function renderCustomerOrderDetails(record) {
            return `
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <h4 class="font-bold text-slate-800 text-xs">Rancangan & Spesifikasi Komputer</h4>
                        <span class="text-[11px] bg-slate-100 px-2.5 py-1 rounded-lg text-slate-600 font-semibold">Jenis: ${record.orderType}</span>
                    </div>

                    <div class="overflow-hidden border border-slate-200 rounded-2xl">
                        <table class="w-full text-left text-xs">
                            <thead class="bg-slate-100 text-slate-600 font-bold uppercase text-[10px]">
                                <tr>
                                    <th class="p-3">Komponen</th>
                                    <th class="p-3">Spesifikasi</th>
                                    <th class="p-3 text-center">Qty</th>
                                    <th class="p-3 text-right">Harga</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                ${record.excelData && record.excelData.length > 0 ? record.excelData.map(item => `
                                    <tr class="hover:bg-slate-50/80">
                                        <td class="p-3 font-semibold text-slate-800">${item.component}</td>
                                        <td class="p-3 text-slate-600">${item.spec}</td>
                                        <td class="p-3 text-center font-medium">${item.qty}</td>
                                        <td class="p-3 text-right font-mono text-slate-700">${formatRupiah(item.price)}</td>
                                    </tr>
                                `).join('') : `
                                    <tr><td colspan="4" class="p-4 text-center text-slate-400">Rancangan belum diunggah.</td></tr>
                                `}
                            </tbody>
                        </table>
                    </div>

                    <div class="flex justify-between items-center p-4 bg-[#003b87] text-white rounded-2xl shadow-sm">
                        <span class="text-xs font-semibold text-blue-200">Total Estimasi Anggaran</span>
                        <span class="text-lg font-bold font-mono text-amber-300">${formatRupiah(record.estimatedPrice)}</span>
                    </div>
                </div>
            `;
        }

        function renderCustomerServiceDetails(record) {
            return `
                <div class="space-y-4">
                    <h4 class="font-bold text-slate-800 text-xs">Barang Service & Kendala</h4>
                    
                    <div class="space-y-2">
                        ${record.items.map((item, idx) => `
                            <div class="p-3.5 border border-slate-200 rounded-2xl bg-slate-50/60 flex flex-col sm:flex-row justify-between sm:items-center gap-2">
                                <div class="flex items-center gap-3">
                                    <span class="w-6 h-6 rounded-lg bg-blue-100 text-blue-700 text-xs font-bold flex items-center justify-center">${idx + 1}</span>
                                    <div>
                                        <p class="font-bold text-xs text-slate-800">${item.name}</p>
                                        <p class="text-xs text-rose-600 font-medium"><i class="fa-solid fa-triangle-exclamation mr-1"></i>${item.issue}</p>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    ${record.notes ? `
                        <div class="p-3.5 bg-amber-50 border border-amber-200 rounded-2xl text-xs text-amber-900">
                            <strong><i class="fa-solid fa-note-sticky mr-1"></i>Catatan Layanan:</strong> ${record.notes}
                        </div>
                    ` : ''}

                    <div class="flex justify-between items-center p-4 bg-[#003b87] text-white rounded-2xl shadow-sm">
                        <span class="text-xs font-semibold text-blue-200">Estimasi Biaya Perbaikan</span>
                        <span class="text-lg font-bold font-mono text-amber-300">${formatRupiah(record.estimatedPrice)}</span>
                    </div>
                </div>
            `;
        }

        // ------------------------------------------
        // ADMIN DASHBOARD & BENDAHARA DCC STYLE LAYOUT
        // ------------------------------------------
        function renderAdminView() {
            return `
                <div class="min-h-screen bg-[#00459c] text-white flex flex-col">
                    <!-- Header Section (Matching Bendahara DCC Header Style) -->
                    <header class="bg-[#003b87] text-white sticky top-0 z-30 shadow-lg border-b border-white/10">
                        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                            <!-- Left Admin User Info -->
                            <div class="flex items-center gap-3">
                                <div class="w-11 h-11 rounded-full bg-blue-400/20 border-2 border-blue-300/40 flex items-center justify-center text-amber-300 font-bold text-xl shadow-inner">
                                    <i class="fa-solid fa-user-shield"></i>
                                </div>
                                <div>
                                    <div class="flex items-center gap-2">
                                        <span class="text-[11px] font-semibold text-blue-200">Admin Staff</span>
                                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                                    </div>
                                    <h1 class="text-xl font-extrabold tracking-tight">Bendahara DCC</h1>
                                </div>
                            </div>

                            <!-- Right Nav Actions & Logout -->
                            <div class="flex items-center gap-3">
                                <div class="bg-white/10 p-1 rounded-2xl border border-white/15 flex gap-1">
                                    ${renderNavBtn('beranda', 'Beranda', 'fa-house')}
                                    ${renderNavBtn('pemesanan', 'Pemesanan', 'fa-cart-shopping')}
                                    ${renderNavBtn('service', 'Service', 'fa-wrench')}
                                    ${renderNavBtn('riwayat', 'Riwayat', 'fa-clock-rotate-left')}
                                    ${renderNavBtn('rekapan', 'Rekapan', 'fa-chart-line')}
                                </div>

                                <button id="adminLogoutBtn" class="w-9 h-9 rounded-full bg-white/10 hover:bg-rose-600 text-white flex items-center justify-center transition-all border border-white/20" title="Keluar">
                                    <i class="fa-solid fa-right-from-bracket text-xs"></i>
                                </button>
                            </div>
                        </div>
                    </header>

                    <!-- Main Dashboard Window Container -->
                    <main class="flex-grow max-w-6xl w-full mx-auto p-4 sm:p-6 my-4">
                        <div class="bg-slate-50 text-slate-800 rounded-[28px] p-6 sm:p-8 shadow-2xl space-y-6">
                            ${renderAdminTabContent()}
                        </div>
                    </main>

                    <footer class="py-4 text-center text-xs text-blue-200/70">
                        Akses Khusus Bendahara &bull; Realtime Cloud Sync
                    </footer>
                </div>
            `;
        }

        function renderNavBtn(tabKey, label, icon) {

        function renderTabPemesanan() {
            return `

                                        <th class="p-3.5">Jenis Pesanan</th>
                                        <th class="p-3.5">Progres</th>

        function renderOrderRows(ordersList) {
            if (ordersList.length === 0) {
                return `<tr><td colspan="8" class="p-6 text-center text-slate-400">Belum ada data pemesanan.</td></tr>`;
            }

            return ordersList.map(item => `
                <tr class="hover:bg-slate-50/80">
                    <td class="p-3.5 font-mono font-bold text-blue-700">
                        <button onclick="viewOrderDetail('${item.id}')" class="hover:underline flex items-center gap-1">

                        </button>

                    <td class="p-3.5 text-slate-500">${item.date}</td>
                    <td class="p-3.5 font-bold text-slate-800">${item.customerName}</td>
                    <td class="p-3.5 text-slate-600">${item.room}</td>
                    <td class="p-3.5 text-slate-600 font-medium">${item.orderType}</td>
                    <td class="p-3.5">
                        <select onchange="updateOrderStatus('${item.id}', this.value)" class="px-2 py-1 rounded-lg text-xs font-bold bg-slate-100 border border-slate-200 text-slate-700 focus:outline-none focus:ring-1 focus:ring-blue-600">
                            ${ORDER_STAGES.map((stg, idx) => `
                                <option value="${idx}" ${item.progress === idx ? 'selected' : ''}>${stg.title}</option>
                            `).join('')}
                        </select>
                    </td>
                    <td class="p-3.5 text-right font-mono font-bold text-slate-700">${formatRupiah(item.estimatedPrice)}</td>
                    <td class="p-3.5">
                        <div class="flex items-center justify-center gap-1.5">
                            <button onclick="shareWAOrder('${item.id}')" class="w-7 h-7 rounded-lg bg-emerald-50 text-emerald-600 hover:bg-emerald-600 hover:text-white transition-all flex items-center justify-center" title="Konfirmasi WA">
                                <i class="fa-brands fa-whatsapp text-sm"></i>
                            </button>
                            <button onclick="openOrderModal('${item.id}')" class="w-7 h-7 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all flex items-center justify-center" title="Edit">
                                <i class="fa-solid fa-pen-to-square text-xs"></i>
                            </button>
                            <button onclick="deleteOrder('${item.id}')" class="w-7 h-7 rounded-lg bg-rose-50 text-rose-600 hover:bg-rose-600 hover:text-white transition-all flex items-center justify-center" title="Hapus">

                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function filterOrderTable() {
            const val = document.getElementById('searchOrderInput').value.toLowerCase();
            const filtered = appData.orders.filter(o => 
                o.id.toLowerCase().includes(val) || 
                o.customerName.toLowerCase().includes(val) || 
                o.room.toLowerCase().includes(val)
            );
            document.getElementById('orderTableBody').innerHTML = renderOrderRows(filtered);
        }

        function openOrderModal(orderId = null) {
            const isEdit = !!orderId;
            const record = isEdit ? appData.orders.find(o => o.id === orderId) : null;
            const newId = isEdit ? record.id : generateUniqueId('ORD');

            const contentHtml = `
                <div class="p-6 sm:p-8 space-y-5">
                    <div class="flex justify-between items-center border-b border-slate-100 pb-4">
                        <h3 class="font-bold text-slate-900 text-lg">${isEdit ? 'Edit Data Pemesanan' : 'Tambah Pesanan Baru'}</h3>
                        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg"><i class="fa-solid fa-xmark"></i></button>
                    </div>

                    <form id="orderForm" onsubmit="saveOrderForm(event, '${isEdit ? record.id : ''}')" class="space-y-4">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">Kode Unik (Otomatis)</label>
                                <input type="text" id="ordId" value="${newId}" readonly class="w-full px-3.5 py-2.5 text-xs bg-slate-100 border border-slate-200 rounded-xl font-mono font-bold text-blue-700">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">Nama Pemesan</label>
                                <input type="text" id="ordCustomer" value="${isEdit ? record.customerName : ''}" required class="w-full px-3.5 py-2.5 text-xs border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600 outline-none font-medium">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">Kamar / Bagian</label>
                                <input type="text" id="ordRoom" value="${isEdit ? record.room : ''}" required class="w-full px-3.5 py-2.5 text-xs border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600 outline-none font-medium">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">Jenis Pesanan (Manual)</label>
                                <input type="text" id="ordType" value="${isEdit ? record.orderType : ''}" placeholder="mis: PC Full Set, Printer..." required class="w-full px-3.5 py-2.5 text-xs border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600 outline-none font-medium">
                            </div>
                        </div>

                        <!-- EXCEL PARSER PASTE AREA -->
                        <div class="space-y-2 border-t border-b border-slate-100 py-4">
                            <div class="flex justify-between items-center">
                                <label class="block text-xs font-bold text-blue-900">
                                    <i class="fa-solid fa-file-excel text-emerald-600 mr-1"></i> Paste Tabel Rancangan dari Excel
                                </label>
                                <span class="text-[10px] text-slate-400">Salin dari Excel lalu Tempel di bawah</span>
                            </div>
                            <textarea id="excelPasteArea" onpaste="handleExcelPaste(event)" placeholder="Tempel (Ctrl+V) tabel spesifikasi Excel di sini..." 
                                class="w-full h-20 p-3 text-xs font-mono bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600 outline-none"></textarea>

                            <div class="mt-2">
                                <h4 class="text-[11px] font-bold text-slate-500 mb-1">Hasil Konversi Spesifikasi:</h4>
                                <div class="max-h-36 overflow-y-auto border border-slate-200 rounded-xl">
                                    <table class="w-full text-left text-[11px]" id="excelPreviewTable">
                                        <thead class="bg-slate-100 text-slate-600 font-bold uppercase sticky top-0">
                                            <tr>
                                                <th class="p-2">Komponen</th>
                                                <th class="p-2">Spesifikasi</th>
                                                <th class="p-2 text-center">Qty</th>
                                                <th class="p-2 text-right">Harga</th>
                                            </tr>
                                        </thead>
                                        <tbody id="excelPreviewBody" class="divide-y divide-slate-100 font-mono">
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">Estimasi Total Harga (Rp)</label>
                                <input type="number" id="ordPrice" value="${isEdit ? record.estimatedPrice : 0}" required class="w-full px-3.5 py-2.5 text-xs border border-slate-200 rounded-xl font-mono font-bold text-slate-800 focus:ring-2 focus:ring-blue-600 outline-none">
                            </div>
                            <div class="flex items-end">
                                <button type="submit" class="w-full py-2.5 bg-[#0058c4] hover:bg-blue-700 text-white font-bold text-xs rounded-xl transition-all shadow-md">
                                    Simpan Pesanan
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            `;
            openModal(contentHtml);

            if (isEdit && record.excelData) {
                window.tempExcelParsed = [...record.excelData];
                renderExcelPreviewTable(record.excelData);
            } else {
                window.tempExcelParsed = [];
                renderExcelPreviewTable([]);
            }
        }

        function handleExcelPaste(e) {
            e.preventDefault();
            const clipboardData = (e.clipboardData || window.clipboardData).getData('text');
            if (!clipboardData) return;

            const rows = clipboardData.trim().split(/\r\n|\n|\r/);
            const parsedItems = [];
            let calculatedTotal = 0;

            rows.forEach(rowStr => {
                const cols = rowStr.split('\t');
                if (cols.length >= 2) {
                    const component = cols[0] ? cols[0].trim() : 'Komponen';
                    const spec = cols[1] ? cols[1].trim() : '-';
                    const qty = cols[2] && !isNaN(parseInt(cols[2])) ? parseInt(cols[2]) : 1;
                    let price = 0;
                    if (cols[3]) {
                        price = parseInt(cols[3].replace(/[^0-9]/g, '')) || 0;
                    }

                    parsedItems.push({ component, spec, qty, price });
                    calculatedTotal += (qty * price);
                }
            });

            window.tempExcelParsed = parsedItems;
            renderExcelPreviewTable(parsedItems);

            if (calculatedTotal > 0) {
                document.getElementById('ordPrice').value = calculatedTotal;
            }

            showToast(`Berhasil mengonversi ${parsedItems.length} baris tabel Excel!`, 'success');
        }

        function renderExcelPreviewTable(items) {
            const tbody = document.getElementById('excelPreviewBody');
            if (!tbody) return;
            if (items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-3 text-center text-slate-400 text-xs">Belum ada data tabel. Paste dari Excel di atas.</td></tr>`;
                return;
            }

            tbody.innerHTML = items.map(it => `
                <tr class="hover:bg-slate-50">
                    <td class="p-2 font-semibold text-slate-800">${it.component}</td>
                    <td class="p-2 text-slate-600">${it.spec}</td>
                    <td class="p-2 text-center">${it.qty}</td>
                    <td class="p-2 text-right">${formatRupiah(it.price)}</td>
                </tr>
            `).join('');
        }

        function saveOrderForm(e, editId) {
            e.preventDefault();
            const id = document.getElementById('ordId').value;
            const customerName = document.getElementById('ordCustomer').value;
            const room = document.getElementById('ordRoom').value;
            const orderType = document.getElementById('ordType').value;
            const estimatedPrice = parseInt(document.getElementById('ordPrice').value) || 0;
            const excelData = window.tempExcelParsed || [];

            if (editId) {
                const idx = appData.orders.findIndex(o => o.id === editId);
                if (idx !== -1) {
                    appData.orders[idx] = {
                        ...appData.orders[idx],
                        customerName, room, orderType, estimatedPrice, excelData
                    };
                }
            } else {
                appData.orders.unshift({
                    id,
                    date: new Date().toISOString().split('T')[0],
                    customerName, room, orderType, estimatedPrice,
                    progress: 0,
                    excelData
                });
            }

            saveData();
            closeModal();
            renderApp();
            showToast('Data pemesanan berhasil disimpan!', 'success');
        }

        function updateOrderStatus(id, newStatusIdx) {
            const idx = appData.orders.findIndex(o => o.id === id);
            if (idx !== -1) {
                appData.orders[idx].progress = parseInt(newStatusIdx);
                saveData();
                showToast(`Status ${id} diperbarui!`, 'success');
            }
        }

        function deleteOrder(id) {
            if (confirm(`Yakin ingin menghapus pesanan ${id}?`)) {
                appData.orders = appData.orders.filter(o => o.id !== id);
                saveData();
                renderApp();
                showToast('Data pemesanan berhasil dihapus.', 'info');
            }
        }

        function viewOrderDetail(id) {
            const item = appData.orders.find(o => o.id === id);
            if (!item) return;

            const contentHtml = `
                <div class="p-6 space-y-4">
                    <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                        <div>
                            <span class="text-xs font-mono font-bold text-blue-700">${item.id}</span>
                            <h3 class="font-bold text-slate-800 text-lg">${item.customerName} &bull; ${item.room}</h3>
                        </div>
                        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                    </div>

                    ${renderCustomerOrderDetails(item)}
                </div>
            `;
            openModal(contentHtml);
        }

        function shareWAOrder(id) {
            const item = appData.orders.find(o => o.id === id);
            if (!item) return;

            const textMsg = `Yth. Bapak/Ibu *${item.customerName}* (${item.room}),\n\n` +
                `Berikut konfirmasi rincian rancangan pemesanan unit di *DCC Center*:\n` +
                `------------------------------------\n` +
                `📌 *Kode Unik ID:* ${item.id}\n` +
                `📅 *Tanggal Masuk:* ${item.date}\n` +
                `🖥️ *Jenis Pesanan:* ${item.orderType}\n` +
                `💰 *Estimasi Biaya:* ${formatRupiah(item.estimatedPrice)}\n` +
                `🔄 *Status Terkini:* ${ORDER_STAGES[item.progress].title}\n` +
                `------------------------------------\n` +
                `Anda dapat memantau progres pesanan secara real-time melalui website aplikasi kami dengan memasukkan Kode Unik ID di atas.\n\n` +
                `Terima kasih telah memercayakan kebutuhan IT Anda kepada Bendahara DCC! 🙏`;

            const encoded = encodeURIComponent(textMsg);

        function saveServiceForm(e, editId) {
            e.preventDefault();
            const id = document.getElementById('svcId').value;
            const customerName = document.getElementById('svcCustomer').value;
            const room = document.getElementById('svcRoom').value;
            const notes = document.getElementById('svcNotes').value;
            const estimatedPrice = parseInt(document.getElementById('svcPrice').value) || 0;

            const itemRows = document.querySelectorAll('.service-item-row');
            const items = [];
            itemRows.forEach(row => {
                const name = row.querySelector('.svc-item-name').value;
                const issue = row.querySelector('.svc-item-issue').value;
                if (name && issue) {
                    items.push({ name, issue });
                }
            });

            if (items.length === 0) {
                showToast('Harap isi minimal 1 barang service & kendala!', 'error');
                return;
            }

            if (editId) {
                const idx = appData.services.findIndex(s => s.id === editId);
                if (idx !== -1) {
                    appData.services[idx] = {
                        ...appData.services[idx],
                        customerName, room, notes, estimatedPrice, items
                    };
                }
            } else {
                appData.services.unshift({
                    id,
                    date: new Date().toISOString().split('T')[0],
                    customerName, room, notes, estimatedPrice,
                    progress: 0,
                    items
                });
            }

            saveData();
            closeModal();
            renderApp();
            showToast('Data service berhasil disimpan!', 'success');
        }

        function updateServiceStatus(id, newStatusIdx) {
            const idx = appData.services.findIndex(s => s.id === id);
            if (idx !== -1) {
                appData.services[idx].progress = parseInt(newStatusIdx);
                saveData();
                showToast(`Status ${id} diperbarui!`, 'success');
            }
        }

        function deleteService(id) {
            if (confirm(`Yakin ingin menghapus service ${id}?`)) {
                appData.services = appData.services.filter(s => s.id !== id);
                saveData();
                renderApp();
                showToast('Data service berhasil dihapus.', 'info');
            }
        }

        function applyRiwayatFilter() {
            const keyword = document.getElementById('filterRiwayatSearch')?.value.toLowerCase() || '';
            const dateFrom = document.getElementById('filterRiwayatDateFrom')?.value || '';
            const dateTo = document.getElementById('filterRiwayatDateTo')?.value || '';

            const filterFn = (item) => {
                const matchKw = item.id.toLowerCase().includes(keyword) ||
                                item.customerName.toLowerCase().includes(keyword) ||
                                item.room.toLowerCase().includes(keyword);
                
                let matchDate = true;
                if (dateFrom && item.date < dateFrom) matchDate = false;
                if (dateTo && item.date > dateTo) matchDate = false;

                return matchKw && matchDate;
            };

            const filteredServices = appData.services.filter(filterFn);
            const filteredOrders = appData.orders.filter(filterFn);

            const svcContainer = document.getElementById('riwayatServiceList');
            const svcCount = document.getElementById('countSvcRiwayat');

        function initRekapanCharts() {
            const aggregateByDate = (itemsList) => {
                const map = {};
                itemsList.forEach(item => {
                    const d = item.date || '2026-10-25';
                    map[d] = (map[d] || 0) + (item.estimatedPrice || 0);
                });
                const dates = Object.keys(map).sort();
                const values = dates.map(d => map[d]);
                return { dates, values };
            };

            const svcAgg = aggregateByDate(appData.services);
            const ordAgg = aggregateByDate(appData.orders);

            const ctxSvc = document.getElementById('chartServiceIncome');
            if (ctxSvc) {
                new Chart(ctxSvc, {
                    type: 'line',
                    data: {
                        labels: svcAgg.dates.length ? svcAgg.dates : ['2026-10-25', '2026-10-26', '2026-10-27', '2026-10-28'],
                        datasets: [{
                            label: 'Pemasukan Service (Rp)',
                            data: svcAgg.values.length ? svcAgg.values : [100000, 350000, 200000, 150000],
                            borderColor: '#f59e0b',
                            backgroundColor: 'rgba(245, 158, 11, 0.1)',
                            fill: true,
                            tension: 0.3,
                            borderWidth: 3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: { y: { beginAtZero: true } }
                    }
                });
            }

            const ctxOrd = document.getElementById('chartOrderIncome');
            if (ctxOrd) {
                new Chart(ctxOrd, {
                    type: 'line',
                    data: {
                        labels: ordAgg.dates.length ? ordAgg.dates : ['2026-10-25', '2026-10-26', '2026-10-27', '2026-10-28'],
                        datasets: [{
                            label: 'Pemasukan Pemesanan (Rp)',
                            data: ordAgg.values.length ? ordAgg.values : [18500000, 5000000, 7200000, 12000000],
                            borderColor: '#0058c4',
                            backgroundColor: 'rgba(0, 88, 196, 0.1)',
                            fill: true,
                            tension: 0.3,
                            borderWidth: 3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: { y: { beginAtZero: true } }
                    }
                });
            }
        }

        // ==========================================
        // EVENT LISTENERS & ROUTING
        // ==========================================
        function attachCustomerEvents() {
            // Secret Admin Trigger Button & Modal (Matching Screenshot Bendahara DCC Modal)
            const secretBtn = document.getElementById('secretAdminBtn');
            if (secretBtn) {
                secretBtn.addEventListener('click', () => {
                    const contentHtml = `
                        <div class="p-8 space-y-6 text-center">
                            <!-- Rounded User Icon Badge from Screenshot -->
                            <div class="w-16 h-16 bg-blue-100 text-[#0058c4] rounded-2xl flex items-center justify-center text-2xl font-bold mx-auto">
                                <i class="fa-solid fa-user-tie"></i>
                            </div>
                            
                            <div>
                                <h3 class="font-extrabold text-slate-900 text-xl tracking-tight">Bendahara DCC</h3>
                                <p class="text-xs text-slate-400 mt-1">Masukkan Password Akses Keuangan Sektor</p>
                            </div>

                            <form id="adminLoginForm" class="space-y-4 text-left">
                                <div>
                                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">PASSWORD</label>
                                    <div class="relative">
                                        <i class="fa-solid fa-key absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                                        <input type="password" id="adminPasswordInput" placeholder="Masukkan password" required 
                                            class="w-full pl-10 pr-4 py-3 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600 outline-none font-medium">
                                    </div>
                                </div>
                                
                                <button type="submit" class="w-full py-3 bg-[#0058c4] hover:bg-blue-700 text-white font-bold text-xs rounded-xl transition-all shadow-md flex items-center justify-center gap-2">
                                    <span>Masuk ke Sistem</span>
                                    <i class="fa-solid fa-arrow-right"></i>
                                </button>
                            </form>

                            <p class="text-[10px] text-slate-400 pt-2 border-t border-slate-100">
                                Akses Khusus Bendahara &bull; Realtime Cloud Sync
                            </p>
                        </div>
                    `;
                    openModal(contentHtml);

                    document.getElementById('adminLoginForm').addEventListener('submit', (e) => {
                        e.preventDefault();
                        const pwd = document.getElementById('adminPasswordInput').value;
                        if (pwd === 'staffdcc2.2') {
                            appData.currentRole = 'admin';
                            appData.activeTab = 'beranda';
                            closeModal();
                            renderApp();
                            showToast('Selamat datang, Admin Bendahara DCC!', 'success');
                        } else {
                            showToast('Kata sandi salah! Akses ditolak.', 'error');
                        }
                    });
                });
            }

            const lookupForm = document.getElementById('customerLookupForm');
            if (lookupForm) {
                lookupForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const code = document.getElementById('customerCodeInput').value.trim().toUpperCase();
                    
                    let found = appData.orders.find(o => o.id.toUpperCase() === code);
                    if (!found) {
                        found = appData.services.find(s => s.id.toUpperCase() === code);
                    }

                    if (found) {
                        appData.customerActiveRecord = found;
                        renderApp();
                    } else {
                        showToast('Kode Unik Tidak Ditemukan / Sudah Kadaluarsa.', 'error');
                    }
                });
            }

            const resetBtn = document.getElementById('resetSearchBtn');
            if (resetBtn) {
                resetBtn.addEventListener('click', () => {
                    appData.customerActiveRecord = null;
                    renderApp();
                });
            }
        }

        function attachAdminEvents() {
            const logoutBtn = document.getElementById('adminLogoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    appData.currentRole = 'customer';
                    appData.customerActiveRecord = null;
                    renderApp();
                    showToast('Berhasil keluar dari panel Admin.', 'info');
                });
            }

            if (appData.activeTab === 'riwayat') {
                setTimeout(applyRiwayatFilter, 50);
            }
        }

        window.onload = function() {
            renderApp();
        };
    </script>
</body>
